<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LU M1 Clinical Psychology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a printed LU timetable sheet as the home screen; every other screen is an exam-correction sheet in the same ink. */
:root {
  --paper: #ffffff; --ink: #0d0d0d; --ink2: #383838; --muted: #6b6b68; --rule: #0d0d0d; --hair: #d2d2cf;
  --band: #d3d3d3; --band2: #f0f0ee; --soft: #f6f6f3; --ob: #e1141b; --hl: #00f0f0; --hlink: #000000;
  --ok: #0e7a3b; --bad: #c8161d; --warn: #9a6a00;
  --f-doc: "Tinos", "Times New Roman", Times, serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121314; --ink: #ecece8; --ink2: #c6c6c1; --muted: #9b9b96; --rule: #e6e6e2; --hair: #393a3c;
  --band: #2c2e31; --band2: #1b1c1e; --soft: #191a1c; --ob: #ff5b60; --hl: #00e4e4; --hlink: #000000;
  --ok: #4fcf88; --bad: #ff6d72; --warn: #e2b450; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121314; --ink: #ecece8; --ink2: #c6c6c1; --muted: #9b9b96; --rule: #e6e6e2; --hair: #393a3c;
  --band: #2c2e31; --band2: #1b1c1e; --soft: #191a1c; --ob: #ff5b60; --hl: #00e4e4; --hlink: #000000;
  --ok: #4fcf88; --bad: #ff6d72; --warn: #e2b450; color-scheme: dark; }

html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 96px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
mark { background: var(--hl); color: var(--hlink); padding: 0 .12em; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 2px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-doc); font-weight: 700; letter-spacing: .22em; font-size: 19px; cursor: pointer; background: none; border: 0; padding: 0; }
.brand small { display: block; font-family: var(--f-ui); font-weight: 400; letter-spacing: .02em; font-size: 11.5px; color: var(--muted); }
.top .meta { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font-size: 12px; border: 1px solid var(--rule); padding: 2px 8px; white-space: nowrap; background: var(--paper); }
.pill.hl { background: var(--hl); color: var(--hlink); border-color: var(--hl); }
.pill.off { color: var(--muted); border-color: var(--hair); }
nav.tabs { display: flex; gap: 2px; }
nav.tabs button { border: 0; background: none; padding: 6px 10px; cursor: pointer; font-size: 14px; border-bottom: 3px solid transparent; }
nav.tabs button.on { border-bottom-color: var(--ink); font-weight: 600; }
@media (max-width: 760px) {
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 2px solid var(--rule); justify-content: space-around; padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); z-index: 30; }
  nav.tabs button { font-size: 12px; padding: 6px 4px; flex: 1; }
}

h1, h2, h3 { font-family: var(--f-doc); text-wrap: balance; margin: 0; }
h2 { font-size: 22px; } h3 { font-size: 17px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
section.block { margin-block: 22px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.grid2 > * { min-width: 0; }

/* buttons */
.btn { border: 1.5px solid var(--ink); background: var(--paper); padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--soft); }
.btn.pri { background: var(--ink); color: var(--paper); }
.btn.pri:hover { opacity: .88; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: var(--hair); }
.btn:disabled { opacity: .45; cursor: default; }
.go { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--paper); border: 0; padding: 16px 20px; cursor: pointer; text-align: left; }
.go b { font-family: var(--f-doc); letter-spacing: .3em; font-size: 22px; }
.go span { font-size: 13px; opacity: .85; }
.go:hover { opacity: .92; }

/* the timetable sheet */
.sheet { padding-block: 22px 8px; }
.sheet .hdr { font-family: var(--f-doc); font-size: 17px; line-height: 1.32; margin-bottom: 26px; }
.sheet .ttl { font-family: var(--f-doc); font-weight: 700; text-align: center; font-size: 17px; line-height: 1.3; margin-bottom: 4px; }
.tt-scroll { overflow-x: auto; }
table.tt { width: 100%; border-collapse: collapse; font-family: var(--f-doc); border: 2.5px solid var(--rule); min-width: 760px; table-layout: fixed; }
table.tt th { font-size: 20px; padding: 6px; border: 2px solid var(--rule); font-weight: 700; }
table.tt td { border: 2px solid var(--rule); text-align: center; vertical-align: top; padding: 0; }
table.tt tr.band td { background: var(--band); font-weight: 700; font-size: 16.5px; padding: 3px 4px; }
table.tt tr.band.empty td { height: 30px; }
.cell { display: block; width: 100%; background: none; border: 0; cursor: pointer; padding: 8px 6px 6px; font-family: var(--f-doc); text-align: center; line-height: 1.28; min-height: 120px; }
.cell:hover { background: var(--soft); }
.cell.live { box-shadow: inset 0 0 0 4px var(--hl); }
.cell .t { font-weight: 700; font-size: 17px; display: block; }
.cell .tag { color: var(--ob); font-weight: 700; display: block; font-size: 17px; }
.cell .cr { display: block; font-size: 16.5px; }
.ob { color: var(--ob); font-weight: 700; }
.cell .in { display: block; font-size: 16.5px; }
.cell .st { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 7px; font-family: var(--f-ui); font-size: 11.5px; color: var(--ink2); }
.lv { font-family: var(--f-num); font-size: 11px; border: 1px solid var(--rule); padding: 0 4px; }
.ring { width: 20px; height: 20px; }
.daytabs { display: none; }
@media (max-width: 600px) {
  .tt-scroll { display: none; }
  .daytabs { display: block; }
  .sheet .hdr { font-size: 15px; margin-bottom: 16px; }
  .sheet .ttl { font-size: 15px; }
}
.dt-bar { display: flex; border: 2px solid var(--rule); border-bottom: 0; }
.dt-bar button { flex: 1; border: 0; border-right: 2px solid var(--rule); background: var(--paper); font-family: var(--f-doc); font-weight: 700; padding: 8px 0; cursor: pointer; font-size: 15px; }
.dt-bar button:last-child { border-right: 0; }
.dt-bar button.on { background: var(--band); }
.dt-list { border: 2px solid var(--rule); }
.dt-slot { border-bottom: 2px solid var(--rule); }
.dt-slot:last-child { border-bottom: 0; }
.dt-slot .bd { background: var(--band); font-family: var(--f-doc); font-weight: 700; text-align: center; padding: 3px; border-bottom: 2px solid var(--rule); }
.dt-empty { padding: 26px; text-align: center; font-family: var(--f-doc); color: var(--muted); }

/* today strip */
.today { border: 2px solid var(--rule); border-top: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.today .line { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* practice */
.ptop { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 14px 10px; border-bottom: 1px solid var(--hair); }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.ctl select, .ctl input[type=number] { border: 1px solid var(--rule); background: var(--paper); padding: 3px 6px; }
.ctl input[type=range] { width: 110px; accent-color: var(--ink); }
.qcard { margin-block: 18px; border: 2px solid var(--rule); background: var(--paper); }
.qhead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 14px; border-bottom: 2px solid var(--rule); background: var(--band2); font-size: 12.5px; }
.qhead .c { font-weight: 600; }
.qbody { padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.stem { font-family: var(--f-doc); font-size: 19px; line-height: 1.45; max-width: 68ch; }
.vg { font-family: var(--f-doc); font-size: 16px; border-left: 4px solid var(--hl); padding-left: 12px; color: var(--ink2); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; text-align: left; border: 1.5px solid var(--hair); background: var(--paper); padding: 10px 12px; cursor: pointer; font-size: 15.5px; }
.opt:hover { border-color: var(--ink); }
.opt .L { font-family: var(--f-doc); font-weight: 700; font-size: 17px; text-align: center; }
.opt.sel { border-color: var(--ink); }
.opt.sel .L { background: var(--hl); color: var(--hlink); }
.opt.gone { opacity: .3; text-decoration: line-through; pointer-events: none; }
.opt.right { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
.opt.wrong { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
.opt[disabled] { cursor: default; }
textarea, input[type=text], input[type=date], input[type=number], input[type=month] { border: 1.5px solid var(--hair); background: var(--paper); padding: 8px 10px; width: 100%; }
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
textarea:focus, input:focus { border-color: var(--ink); outline: none; }
.conf { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.conf .lbl { font-size: 13px; margin-right: 4px; }
.verdict { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 14px; border-top: 2px solid var(--rule); border-bottom: 2px solid var(--rule); font-family: var(--f-doc); font-size: 19px; font-weight: 700; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.verdict small { font-family: var(--f-ui); font-weight: 400; font-size: 13px; color: var(--ink2); }
dl.ex { display: grid; grid-template-columns: 112px 1fr; gap: 0; margin: 0; }
dl.ex dt { font-size: 11px; letter-spacing: .14em; font-weight: 600; padding: 10px 0 10px 14px; border-top: 1px solid var(--hair); }
dl.ex dd { margin: 0; padding: 9px 14px 9px 10px; border-top: 1px solid var(--hair); max-width: 72ch; min-width: 0; }
dl.ex dd.hook { font-family: var(--f-doc); font-size: 17px; }
dl.ex dd ul { margin: 0; padding-left: 18px; }
dl.ex dd li { margin-bottom: 4px; }
@media (max-width: 560px) { dl.ex { grid-template-columns: 1fr; } dl.ex dt { padding-bottom: 0; } dl.ex dd { border-top: 0; padding-left: 14px; } }
details.more { border-top: 1px solid var(--hair); }
details.more summary { padding: 10px 14px; cursor: pointer; font-size: 11px; letter-spacing: .14em; font-weight: 600; list-style: none; }
details.more summary::before { content: "+ "; }
details.more[open] summary::before { content: "− "; }
details.more > div { padding: 0 14px 14px; max-width: 74ch; }
.after { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; border-top: 2px solid var(--rule); align-items: center; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.chip { border: 1px solid var(--hair); background: var(--paper); padding: 3px 9px; cursor: pointer; font-size: 12.5px; }
.chip.on { background: var(--hl); color: var(--hlink); border-color: var(--hl); }
.coach { border: 2px solid var(--rule); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.coach .in { display: flex; gap: 8px; }
.coach .in input { flex: 1; min-width: 0; }
.ai-out { font-size: 15px; max-width: 74ch; }
.ai-out p { margin: 0 0 .7em; }
.ai-out h3, .ai-out h4 { font-family: var(--f-doc); margin: .9em 0 .3em; }
.ai-out ul { margin: 0 0 .7em; padding-left: 20px; }
.note { font-size: 13px; color: var(--ink2); border-left: 3px solid var(--hair); padding-left: 10px; }
.warnline { color: var(--warn); font-size: 13px; }
.thinking { color: var(--muted); font-style: italic; }

/* course hub */
.ladder { display: flex; gap: 3px; align-items: center; }
.ladder i { width: 18px; height: 10px; border: 1px solid var(--rule); display: inline-block; }
.ladder i.on { background: var(--ink); }
.ladder i.cur { background: var(--hl); border-color: var(--rule); }
.clist { border: 2px solid var(--rule); }
.crow { display: grid; grid-template-columns: 1fr 120px 92px; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--hair); }
.crow:last-child { border-bottom: 0; }
.crow .nm { min-width: 0; }
.bar { height: 8px; border: 1px solid var(--rule); position: relative; }
.bar > b { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.status { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.status.m { background: var(--hl); color: var(--hlink); padding: 1px 5px; }
@media (max-width: 560px) { .crow { grid-template-columns: 1fr 70px; } .crow .act { grid-column: 1 / -1; } }
.panel { border: 2px solid var(--rule); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { font-size: 16px; }

/* progress */
table.data { border-collapse: collapse; width: 100%; font-size: 14px; }
table.data th, table.data td { border-bottom: 1px solid var(--hair); padding: 7px 8px; text-align: left; }
table.data th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; border-bottom: 2px solid var(--rule); }
table.data td.n { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(18px, 1fr)); gap: 3px; }
.heat i { aspect-ratio: 1; border: 1px solid var(--hair); display: block; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; border: 2px solid var(--rule); }
.kpis > div { padding: 10px 12px; border-right: 1px solid var(--hair); }
.kpis > div:last-child { border-right: 0; }
.kpis b { display: block; font-family: var(--f-num); font-size: 22px; font-weight: 500; }
.chart svg { width: 100%; height: auto; max-width: 520px; }

/* chat */
.chat { border: 2px solid var(--rule); }
.msgs { display: flex; flex-direction: column; gap: 0; max-height: 58vh; overflow-y: auto; }
.msg { padding: 10px 14px; border-bottom: 1px solid var(--hair); }
.msg .who { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.msg.u { background: var(--soft); }
.msg .tx { white-space: pre-wrap; max-width: 74ch; }
.chat .in { display: flex; gap: 8px; padding: 10px; border-top: 2px solid var(--rule); }
.chat .in textarea { min-height: 54px; flex: 1; min-width: 0; }

/* logbook */
.meter { display: grid; grid-template-columns: 120px 1fr 80px; gap: 10px; align-items: center; font-size: 14px; }
.list { border: 2px solid var(--rule); }
.li { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--hair); font-size: 14px; align-items: start; }
.li:last-child { border-bottom: 0; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.form label { font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.form select { border: 1.5px solid var(--hair); background: var(--paper); padding: 8px; }

.timer { font-family: var(--f-num); font-size: 22px; }
.grandbtn { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; padding: 13px 20px; text-align: left; border: 2px solid var(--ink); }
.grandbtn b { font-family: var(--f-doc); letter-spacing: .3em; font-size: 18px; }
.grandbtn span { font-size: 13px; color: var(--ink2); }
@media (max-width: 520px) { .grandbtn, .go { flex-direction: column; align-items: flex-start; gap: 2px; } }
.cband { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 9px 14px; border-bottom: 2px solid var(--rule); background: var(--hl); color: var(--hlink); }
.cband b { font-family: var(--f-doc); font-size: 16px; }
.cband .eyebrow, .cband .muted { color: var(--hlink); opacity: .75; }
.qmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; margin-top: 10px; max-height: 260px; overflow-y: auto; border: 1px solid var(--hair); padding: 6px; }
.qmap button { border: 1px solid var(--hair); background: var(--paper); font-family: var(--f-num); font-size: 12px; padding: 4px 0; cursor: pointer; }
.qmap button.done { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.qmap button.flag { box-shadow: inset 0 -3px 0 var(--ob); }
.qmap button.cur { outline: 2px solid var(--hl); outline-offset: 1px; }
.resume { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; border: 2px solid var(--rule); background: var(--soft); padding: 10px 14px; margin-top: 16px; }
.chip[disabled] { opacity: .4; cursor: default; }
.flash-ok { box-shadow: inset 0 0 0 4px var(--ok); }
.flash-bad { box-shadow: inset 0 0 0 4px var(--bad); }
.tree button.btn { margin: 0 6px 6px 0; }
@media (prefers-reduced-motion: no-preference) { .qcard { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }

</style>

/* day: 1 Mon .. 5 Fri; times in minutes from midnight (Asia/Beirut) */
const SLOTS = [

/* concept: [id, name, typical level, [prerequisite ids]] */
const CONCEPTS = {
  ACT: [
    ["act_hist", "History of testing: Binet–Simon to Wechsler", 1, []],
    ["act_wech", "Deviation IQ and Wechsler's approach", 1, ["act_hist"]],

{ id: "act1", c: "ACT", k: "act_norms", L: 1, t: "calc",
  q: "A Wechsler index score of 85 (M = 100, SD = 15) falls at roughly which percentile?",
  o: ["16th", "2nd", "25th", "34th", "50th"], a: 0,
  x: { core: "85 is exactly one SD below the mean (z = −1). In a normal distribution about 15.9% of cases fall below z = −1, so the score sits at about the 16th percentile.",
    opts: ["Correct. z = −1 gives ≈16th percentile. Memorize the anchors 2 – 16 – 50 – 84 – 98 for z = −2, −1, 0, +1, +2.",
      "The 2nd percentile is z = −2, an index of 70: the region of the conventional intellectual disability threshold (always read with the SEM).",
      "The 25th percentile is z ≈ −0.67, an index of about 90: the lower edge of the Average band on Wechsler classifications.",
      "34% is the AREA between the mean and −1 SD, not a percentile rank. This is the classic mix-up between band areas and cumulative percentiles.",
      "The 50th percentile is the mean itself, an index of 100."],
    contrast: "Band areas (34%, 14%, 2%) vs cumulative percentiles (50, 16, 2). Students who learned the 68–95–99.7 rule often answer 34.",
    root: "Percentile: Latin per centum, ‘by the hundred’. Galton popularized percentiles in the 1880s for ranking human measurements.",
    image: "A hill of 100 people standing under a bell curve. Plant a flag at −1 SD and count the people behind you: 16.",
    hook: "Sweet SIXTEEN sits ONE step down the hill.",
    depth: "Wechsler composites are deviation scores (M = 100, SD = 15). Subtest scaled scores use M = 10, SD = 3; T scores use M = 50, SD = 10. Convert with z = (X − M)/SD, then read the percentile from the normal curve. An index of 85 equals a scaled score of 7 and a T score of 40. Percentiles are ordinal and compress at the tails: the 5-point gap between 95 and 100 spans about 13 percentile points, while 130 vs 135 spans about one.",
    beyond: "Modern Wechsler norms use inferential norming (smoothing curves across age groups) rather than raw age-band tables, so tabled percentiles can differ slightly from the pure formula, especially at the extremes.",
    exam: "‘Convert an index of 85 into z, T, scaled score and percentile, and give its classification.’ Model: z = −1; T = 40; scaled = 7; ≈16th percentile; Low Average (80–89)." } },
{ id: "act2", c: "ACT", k: "act_wech", L: 2, t: "mcq",
  q: "Who replaced the ratio IQ with the deviation IQ, so that a person is compared with same-age peers instead of dividing mental age by chronological age?",
  o: ["David Wechsler", "William Stern", "Lewis Terman", "Alfred Binet", "Charles Spearman"], a: 0,
  x: { core: "Wechsler's Wechsler–Bellevue Intelligence Scale (1939) introduced the deviation IQ: a standard score that locates the person within his or her age group. It fixed the ratio IQ's collapse in adulthood, when mental age stops rising.",
    opts: ["Correct. Wechsler, chief psychologist at Bellevue Hospital in New York, built his scale for adults, where the ratio IQ fails.",
      "Stern coined the ‘Intelligenzquotient’ in 1912: mental age ÷ chronological age. The right answer if asked who invented the ratio IQ.",
      "Terman's 1916 Stanford–Binet multiplied Stern's ratio by 100 and popularized ‘IQ’ in America. The right answer for the first US standardization.",
      "Binet, with Simon (1905), built the first practical intelligence scale and the concept of mental age, but never an IQ.",
      "Spearman (1904) proposed g through factor analysis: a theory of intelligence, not a scoring method."],
    contrast: "Ratio IQ (Stern, Terman: MA/CA × 100) vs deviation IQ (Wechsler: position in the age-norm distribution). A 40-year-old has no meaningful ‘mental age’.",
    root: "Deviation: Latin deviare, ‘to turn off the road’. The score says how far you turn off the mean.",
    image: "A 40-year-old with a mental age of 20 would get an IQ of 50 under the ratio formula: as absurd as measuring an adult's height growth.",
    hook: "WECHSLER = WE compare with PEERS. STERN = STERN division (MA ÷ CA).",
    depth: "Binet and Simon (1905) answered a French ministry request to identify children who needed special schooling; their 1908 and 1911 revisions grouped items by age level, giving mental age. Stern proposed the quotient (1912) and Terman standardized it on American children (1916). The ratio fails because mental-age growth plateaus in late adolescence and because ratio-IQ SDs differ across ages, so the same IQ meant different rarity at different ages. Wechsler's method fixes M and SD at every age. The Stanford–Binet itself switched to deviation IQ in 1960.",
    beyond: "Wechsler had scored the Army Alpha and Beta tests as a young soldier in World War I; his verbal/performance split echoes Alpha (literate) vs Beta (non-literate) testing.",
    exam: "‘Distinguish ratio IQ from deviation IQ and explain why the latter is required in adult assessment.’" } },
{ id: "act3", c: "ACT", k: "act_sem", L: 3, t: "calc",
  q: "A test has reliability r = .96 and SD = 15. A patient scores 100. Which 95% confidence interval is closest (obtained-score method)?",
  o: ["94–106", "97–103", "85–115", "91–109", "98–102"], a: 0,
  x: { core: "SEM = SD × √(1 − r) = 15 × √0.04 = 15 × 0.2 = 3. The 95% CI is ±1.96 × SEM ≈ ±5.9, so about 94–106.",
    opts: ["Correct: ±1.96 × 3 ≈ ±6.",
      "97–103 is the 68% interval (±1 SEM). The right answer if asked for 68% confidence.",
      "85–115 is ±1 SD: the spread of PEOPLE in the population, not the error band around one person's score.",
      "91–109 is ±3 SEM (≈99.7%), or a 95% CI computed with SEM = 4.5 (r ≈ .91).",
      "98–102 would need SEM ≈ 1, i.e. r ≈ .996, which no IQ composite reaches."],
    contrast: "SD describes differences between people. SEM describes how one person's score would wobble across hypothetical retests.",
    root: "SEM comes from classical test theory (Spearman; Gulliksen, 1950): X = T + E, and the SD of E is the SEM.",
    image: "Your true score is a bull's-eye; each testing is a dart. The SEM is the radius in which 68% of the darts land.",
    hook: "ROOT out the error: SD × ROOT of (one minus r).",
    depth: "Under CTT the observed score X = T + E, with E random. SEM = SD√(1 − r). Confidence multipliers: ±1 SEM ≈ 68%, ±1.645 ≈ 90%, ±1.96 ≈ 95%. Wechsler manuals actually centre intervals on the estimated true score (T̂ = M + r(X − M)) and use the standard error of estimation, SD√(r(1 − r)), which makes intervals asymmetric for extreme scores. At X = 100 there is no regression because X = M. Use the reliability that fits the inference (internal consistency vs test–retest).",
    beyond: "In Hall v. Florida (2014) the US Supreme Court struck down a rigid IQ ≤ 70 cutoff for capital cases precisely because it ignored the SEM around scores near 70.",
    exam: "‘Compute the SEM and the 95% CI for an FSIQ of 100 with r = .96, and explain the interval to the patient's family.’" } },
{ id: "act4", c: "ACT", k: "act_wiscv", L: 3, t: "mcq",
  q: "Structurally, what distinguishes the WISC-V's primary index level from the WAIS-IV's four indexes?",

  x: { core: "The WISC-V (2014) has five primary indexes: VCI, VSI, FRI, WMI, PSI. The WAIS-IV (2008) has four: VCI, PRI, WMI, PSI. Splitting PRI into VSI and FRI follows CHC theory's distinction between Gv (visual processing) and Gf (fluid reasoning).",

    depth: "The WAIS-IV GAI uses Similarities, Vocabulary, Information, Block Design, Matrix Reasoning and Visual Puzzles. Interpretation tests whether the GAI–CPI difference is statistically significant and how rare it is in the norm sample (base rate). Significant differences are common; base rates below about 10–15% are more meaningful. GAI–memory and GAI–achievement comparisons help in assessing memory impairment and learning disorders.",

    exam: "‘Define GAI and CPI and explain when GAI should be reported, with an example.’" } },
{ id: "act7", c: "ACT", k: "act_scatter", L: 6, t: "mcq",
  q: "Which statement best captures the main psychometric critique of interpreting subtest profiles (ipsative scatter) on Wechsler scales?",
  o: ["Subtest-level differences have low reliability and add little incremental validity beyond g and the index scores", "Subtests are more reliable than composites, so profiles should be prioritized", "Scatter is rare, so any scatter indicates brain damage", "Ipsative analysis is required by the publisher for a valid FSIQ", "Profile analysis fails only in children, not adults"], a: 0,
  x: { core: "A difference between two imperfectly reliable subtests is less reliable than either subtest, and each subtest carries much g variance and little unique variance. From McDermott, Fantuzzo and Glutting's 1990 ‘Just say no to subtest analysis’ to Watkins' later work, profile patterns predicted diagnoses or outcomes poorly beyond g.",
    opts: ["Correct.",
      "Reversed: composites are more reliable because they aggregate many items.",
      "Scatter is common in normal samples; large intersubtest ranges have high base rates, so scatter alone cannot signal pathology.",
      "No publisher requires ipsative analysis; manuals present it as optional, with cautions.",
      "The critique holds across ages."],
    contrast: "Normative interpretation (compare with peers) vs ipsative interpretation (compare with oneself). Ipsative analysis inherits the unreliability of difference scores.",
    root: "Ipsative: Latin ipse, ‘self’. The term was introduced by Cattell (1944).",
    image: "Reading tea leaves in the gaps between subtests: pour again and the leaves move (poor retest stability).",
    hook: "IPSE means SELF, and SELF-comparisons sell you noise.",
    depth: "Reliability of a difference score = [(rxx + ryy)/2 − rxy] / (1 − rxy). With subtest reliabilities near .80 and an intercorrelation near .50, the difference reliability is about .60. Kaufman's ‘intelligent testing’ (1979) popularized hypothesis generation from subtest patterns; Glutting, McDermott, Watkins and Canivez repeatedly showed weak diagnostic utility (e.g. the ACID profile in learning disabilities). Current consensus: interpret at FSIQ/index level and treat subtest patterns only as hypotheses to test with other data.",
    beyond: "Bifactor analyses of the WISC-V and WAIS-IV show g takes the largest share of common variance; most group factors keep little unique reliable variance (low omega-hierarchical-subscale), which weakens even strong index-level interpretation.",
    exam: "‘Critically discuss the clinical use of subtest scatter in intelligence assessment.’" } },
{ id: "act8", c: "ACT", k: "act_flynn", L: 7, t: "written",
  q: "Viva: Explain the Flynn effect, give two competing explanations, and show concretely why it matters when you diagnose intellectual disability with a test whose norms are 15 years old.",
  model: "The Flynn effect is the secular rise in IQ test performance over the 20th century: about 3 points per decade on Wechsler- and Binet-type tests, more on fluid tests such as Raven's (Flynn, 1984, 1987). Explanations include better nutrition and health; more and better schooling; greater environmental complexity and test familiarity; Flynn's own account that modern societies trained ‘scientific spectacles’ (abstraction, classification, hypotheticals); and the Dickens–Flynn model of gene–environment multipliers. Since the 1990s some countries (Norway, Denmark, Finland) show a stall or reversal, and within-family analyses of Norwegian conscripts (Bratsberg & Rogeberg, 2018) point to environmental causes. Clinical implication: old norms come from a reference group that would score lower today, so scores are inflated by about 0.3 points per year, roughly 4–5 points over 15 years. A person who scores 72 on old norms might score about 68 on current norms, which can decide an ID diagnosis, school placement, benefits, or in some jurisdictions eligibility for the death penalty. Use the most recent norms, report the norm date, and discuss any Flynn correction cautiously.",
  rubric: ["Defines the secular gain with its size (~3 IQ points per decade) and attributes it to Flynn", "Gives at least two explanations (nutrition/health, schooling, environmental complexity, ‘scientific spectacles’, Dickens–Flynn multiplier)", "Mentions the recent stall or negative Flynn effect", "Computes the inflation from old norms (~0.3 points/year, ~4–5 points over 15 years)", "States the consequence near an ID threshold and a safeguard (current norms, report norm date, triangulate with adaptive functioning)"],
  x: { core: "A strong answer links a population trend to an individual decision: outdated norms make the reference group easier and inflate scores near the ID threshold.",
    root: "Named ‘the Flynn effect’ by Herrnstein and Murray (1994), after James R. Flynn, the New Zealand political scientist who documented it across 14 nations (1987).",
    image: "Whole populations riding an escalator. An old norm table is a photo of the crowd taken from a lower step.",
    hook: "FLYNN scores FLY up about three points a decade.",
    depth: "Gains are largest on fluid, abstract tasks (Raven's, Similarities) and smallest on vocabulary and arithmetic, which argues against a pure gain in g. Wicherts et al. (2004) showed that measurement invariance fails across cohorts, so the gains are not purely on g. Forensic guidance (e.g. AAIDD materials) discusses Flynn adjustments; critics argue corrections assume a linear, uniform drift that may not hold for every subtest or population.",
    beyond: "Recent gains are concentrated in developing countries. Arab-region data are sparse and norms are often imported, so norm drift and cultural mismatch can compound each other: a strong argument for local norming projects in Lebanon.",
    exam: "LU-style essay: ‘Define the Flynn effect and discuss its implications for psychometric assessment.’ Aim for definition + size + two explanations + one clinical consequence." } }
);
SEED.push(
{ id: "int1", c: "INT", k: "int_rogers", L: 1, t: "mcq",
  q: "Rogers (1957) named which three therapist-provided conditions as necessary for constructive personality change?",
  o: ["Congruence, unconditional positive regard, empathic understanding", "Warmth, interpretation, confrontation", "Neutrality, abstinence, anonymity", "Empathy, structuring, homework", "Validation, acceptance, change"], a: 0,
  x: { core: "In ‘The necessary and sufficient conditions of therapeutic personality change’ (1957), Rogers listed six conditions. Three concern the therapist: congruence (genuineness), unconditional positive regard, and accurate empathic understanding communicated to the client.",
    opts: ["Correct.",
      "Interpretation and confrontation are psychodynamic or directive techniques; Rogers saw interpretation as imposing the therapist's frame.",
      "Neutrality, abstinence and anonymity describe the classical analytic stance, nearly the opposite of congruence.",
      "Structuring and homework belong to CBT session design (Beck).",
      "Validation and the acceptance–change dialectic come from DBT (Linehan)."],
    contrast: "Rogers' empathy is accurate understanding of the client's inner frame, communicated back. Kohut's empathy is ‘vicarious introspection’ in the service of understanding selfobject needs.",
    root: "Congruence: Latin congruere, ‘to come together’: inner experience and outward expression coincide.",
    image: "Three lamps on the therapist's desk: a clear glass one (congruence), one that never switches off (positive regard), one turned toward the client's face (empathy).",
    hook: "Rogers gives the client a CUE: Congruence, Unconditional regard, Empathy.",
    depth: "The six conditions: (1) two persons in psychological contact; (2) the client is incongruent, vulnerable or anxious; (3) the therapist is congruent in the relationship; (4) the therapist experiences unconditional positive regard; (5) the therapist experiences empathic understanding of the client's internal frame of reference and tries to communicate it; (6) the client perceives, at least minimally, conditions 4 and 5. Meta-analyses (Elliott et al., 2018) find empathy correlates with outcome around r ≈ .28; positive regard and congruence show smaller but reliable associations.",

    exam: "‘State Rogers' core conditions and illustrate each with an interview response.’" } },
{ id: "int2", c: "INT", k: "int_reflect", L: 2, t: "mcq",
  q: "At intake a 24-year-old says: “I don't even know why I'm here. My mother made the appointment.” Which response is the best reflection?",
  o: ["“Coming here sounds like it was more your mother's idea than yours.”", "“Why did your mother make the appointment?”", "“Don't worry, many people feel nervous at first.”", "“Perhaps you resent your mother for controlling you.”", "“You should give therapy a chance; it can really help.”"], a: 0,
  x: { core: "A reflection mirrors content and implied feeling without adding the clinician's agenda. Naming the ambivalence (her idea, not yours) lets him feel understood and opens the door to his own reasons for coming.",

      "A ‘why’ question invites justification, can feel accusatory, and moves the focus to the mother.",

      "An interpretation of resentment goes beyond the data this early; interpretations need material and alliance first.",

    contrast: "Reflection stays in the client's frame. Interpretation adds a hypothesis about unconscious meaning.",
    root: "Reformulation: Latin re + formula, ‘to give form again’. Rogers called it reflection of feeling.",
    image: "Holding up a clean mirror, not a painted portrait.",
    hook: "RE-FLECT: bend the light BACK, don't add colour.",
    depth: "Reflections range from simple (repeat or paraphrase) to complex (adding implied meaning or feeling, or a double-sided reflection of ambivalence). In motivational interviewing (Miller & Rollnick), about two reflections per question marks proficiency. The French tradition distinguishes reformulation-echo, reformulation-clarification and reformulation-synthesis.",
    beyond: "In Lebanon families often book the appointment and may wait outside or ask to come in. Clarify confidentiality and consent with the adult patient alone first, then negotiate the family's role.",
    exam: "‘Define reformulation, distinguish it from interpretation, and give an example of each.’" } },
{ id: "int3", c: "INT", k: "int_mse", L: 3, t: "mcq",

{ id: "int4", c: "INT", k: "int_bion", L: 5, t: "vignette",
  q: "In a weekly ward group, members keep hinting that two members' budding friendship will somehow ‘save’ the group, and talk of a future rescuer. Which of Bion's basic assumptions is operating?",
  o: ["Pairing", "Dependency", "Fight–flight", "Work group functioning", "Massification"], a: 0,
  x: { core: "In pairing, the group behaves as if a couple will produce a messianic future solution. Hope attaches to an unborn idea or person, which must never actually arrive.",
    opts: ["Correct.",
      "Dependency: the group acts as if a leader (often the therapist) will feed and protect it; members turn passive.",
      "Fight–flight: the group acts as if it must fight or flee an enemy, often by scapegoating or changing topic.",
      "The work group stays on the real task with reality testing; basic assumptions are what pull it off task.",
      "Massification/aggregation is Earl Hopper's later fourth basic assumption, not Bion's."],
    contrast: "Pairing hope (a future rescuer) vs dependency hope (an all-powerful leader now).",
    root: "Bion, Experiences in Groups (1961), from the Northfield experiments and Tavistock groups.",
    image: "Two members on a bench while the rest of the group waits for a baby who never comes.",
    hook: "P for Pairing, P for Pregnancy, P for Postponed salvation.",
    depth: "Bion distinguished the work group from basic-assumption groups (dependency, fight–flight, pairing), each an unconscious shared fantasy that defends against anxiety. Each assumption ‘chooses’ its leader: the most dependence-inducing for dependency, the most paranoid for fight–flight. Tavistock and group-analytic traditions use these ideas to read institutional dynamics, such as staff groups on psychiatric wards.",
    beyond: "Hopper (2003) proposed a fourth basic assumption, Incohesion: Aggregation/Massification, and linked it to trauma; relevant to groups in societies emerging from war.",
    exam: "‘Describe Bion's basic assumptions with a clinical illustration of each.’" } },

{ id: "int6", c: "INT", k: "int_shea", L: 5, t: "mcq",

  o: ["“What other ways have you thought of ending your life?”", "“Have you ever thought of killing yourself?”", "“Many people in your situation think about death. Have you?”", "“So you're not suicidal, right?”", "“Did you take 30 pills or 50?”"], a: 0,

{ id: "int8", c: "INT", k: "int_french", L: 6, t: "written",
  q: "Professor-level: Contrast the open clinical interview of the French psychodynamic tradition (e.g. Colette Chiland) with a structured diagnostic interview such as the SCID-5. Cover epistemology, what each produces, its main risks, and when you would choose each in a Lebanese psychiatric hospital.",
  model: "The French clinical interview (Chiland, L'entretien clinique, 1983; Bénony & Chahraoui) is non-directive or semi-directive. The clinician offers a frame and minimal guidance so the subject's own discourse, associations, silences and relational movements can emerge. Its object is the singular subject and their psychic functioning (conflicts, defences, object relations, transference), and it treats the relationship itself as data. It produces an understanding of meaning and structure, not a checklist diagnosis. Risks: low inter-rater reliability, dependence on the clinician's theory and countertransference, and missed specific symptoms (unasked psychotic or manic features, risk). The SCID-5 (First et al., 2016) is semi-structured and DSM-anchored, with fixed probes, criterion-based scoring and decision trees. Its epistemology is nosological: reliability first. It produces categorical diagnoses comparable across clinicians and studies. Risks: reducing the person to criteria, a stilted alliance, cultural mismatch in item wording, and false positives if probes are taken literally. In a Lebanese hospital: use structured tools (SCID-5, MINI) for research, diagnostic clarification, medico-legal questions and whenever reliability matters; use the open interview for first contact, alliance, the patient's history and family system, and psychotherapy indication. Best practice combines them: an open beginning, focused probes for differential diagnosis and risk, and a closing that returns to the patient's own words.",
  rubric: ["Characterizes the open clinical interview: non/semi-directive, subject-centred, attentive to discourse and relationship (names Chiland or the French tradition)", "Characterizes the SCID-5: semi-structured, DSM-anchored, reliability-oriented", "Contrasts the epistemologies (singular meaning vs nosological reliability)", "Names at least one specific risk of each", "Gives context-sensitive indications for a Lebanese hospital (language, family, stigma, research vs clinical use)", "Proposes an integrated sequence"],
  x: { core: "A top answer treats the two as tools built on different theories of knowledge and integrates them instead of ranking them.",
    root: "Clinical: Greek klinē, ‘bed’: knowledge gained at the patient's bedside, the root of the ‘méthode clinique’.",
    image: "A landscape painter (open interview) and a surveyor with a theodolite (SCID) mapping the same mountain; each misses what the other sees.",
    hook: "KLINĒ is the bedside; SCID is the scaffolding.",
    depth: "Lagache's L'unité de la psychologie (1949) institutionalized the clinical method in French university psychology: the study of the individual case in its totality and situation. Structured interviews grew from the reliability crisis exposed by the US–UK Diagnostic Project (1972) and Rosenhan (1973), leading to the Feighner criteria, RDC, DSM-III (1980) and the SCID. Each interview format embodies a philosophy of mind and of diagnosis.",
    beyond: "Rosenhan's ‘On being sane in insane places’ has been seriously challenged (Cahalan, The Great Pretender, 2019), which questions whether the pseudopatient study happened as reported: a strong viva-level twist on the reliability story.",
    exam: "LU-style: ‘Compare non-directive and structured interviews: advantages, limits, indications.’" } }
);

    contrast: "Stage models (Drotar: a time-limited sequence) vs Olshansky's chronic sorrow (1962): recurring sadness re-triggered at milestones, a normal response rather than pathology.",
    root: "A paediatric team at Case Western Reserve. ‘Reorganization’: the family restructures itself around the child.",
    image: "A wave hits a house: shock, denying the flood, crying and raging, mopping up, then rebuilding the rooms.",
    hook: "Shocked Dads Sometimes Adapt and Reorganize (Shock, Denial, Sadness/anger, Adaptation, Reorganization).",
    depth: "Stage models help you avoid pathologizing early denial or anger, but parents rarely move linearly: milestones such as school entry, puberty or telling others can reawaken grief. Pianta and Marvin's Reaction to Diagnosis Interview assesses whether parents have ‘resolved’ the diagnosis.",

{ id: "spc5", c: "SPC", k: "spc_genetic", L: 4, t: "vignette",
  q: "A 7-year-old is extremely friendly with strangers and speaks fluently with rich vocabulary, but cannot copy simple block designs. She had supravalvular aortic stenosis. Which syndrome is most likely?",
  o: ["Williams syndrome (7q11.23 deletion)", "Fragile X syndrome", "Prader–Willi syndrome", "Angelman syndrome", "Down syndrome"], a: 0,
  x: { core: "Williams syndrome: hypersociability, relatively strong expressive language, marked visuospatial-constructive weakness, characteristic facies, and cardiovascular disease (supravalvular aortic stenosis) from deletion of the elastin gene at 7q11.23.",
    opts: ["Correct.",
      "Fragile X (FMR1 CGG expansion): social anxiety, gaze aversion, ID, autistic features, macroorchidism after puberty.",
      "Prader–Willi (loss of paternal 15q11–q13): neonatal hypotonia, then hyperphagia, obsessive-compulsive features, skin picking.",
      "Angelman (maternal 15q11–q13 / UBE3A): severe ID, absent speech, happy demeanour, ataxia, seizures.",
      "Down syndrome (trisomy 21): ID with relative social strengths, but expressive language is usually weaker than visuospatial skills; early Alzheimer pathology."],
    contrast: "Williams vs Down: both sociable, but in Williams language outstrips visuospatial skill, while in Down syndrome expressive language and grammar lag behind visuospatial skill.",
    root: "Described by J. C. P. Williams (1961) and Beuren (1962).",
    image: "A cocktail-party guest who chats charmingly with everyone but cannot assemble the flat-pack shelf.",
    hook: "WILLIAMS WILL TALK: the elastin stretches the WORDS but snaps the BLOCKS.",
    depth: "Behavioural phenotypes guide assessment and intervention. People with Williams syndrome often have anxiety and specific phobias, and their sociability carries a risk of exploitation. The visuospatial deficit shows on Block Design and drawing; verbal scores overestimate everyday adaptive skills. Genomic imprinting explains Prader–Willi vs Angelman: the same chromosomal region, different parental origin.",
    beyond: "7q11.23 duplication syndrome is the mirror image: speech delay and social anxiety. Together they form a natural experiment linking gene dosage (GTF2I is implicated) to sociability.",
    exam: "‘Describe the behavioural phenotypes of two genetic syndromes and their implications for assessment.’" } },
{ id: "spc6", c: "SPC", k: "spc_teacch", L: 4, t: "mcq",
  q: "Which intervention for autistic children is built on ‘structured teaching’: physical organization of space, visual schedules and work systems?",
  o: ["TEACCH", "Applied Behavior Analysis (discrete trial training)", "PECS", "Early Start Denver Model", "DIR/Floortime"], a: 0,
  x: { core: "TEACCH (Schopler, University of North Carolina, early 1970s) adapts the environment to autistic learning styles through structured teaching: physical structure, schedules, work systems and visual structure.",
    opts: ["Correct.",
      "ABA with discrete trial training (Lovaas, 1987) teaches through operant trials and reinforcement.",
      "PECS (Bondy & Frost, 1985): picture exchange communication, built on ABA principles.",
      "ESDM (Rogers & Dawson): a naturalistic developmental behavioural intervention for toddlers, play-based.",

{ id: "spc7", c: "SPC", k: "spc_vineland", L: 5, t: "vignette",
  q: "A 10-year-old Lebanese boy referred for school failure obtains FSIQ 66 (95% CI 62–71). His Vineland-3 adaptive scores, from parents and teacher, are all in the average range. What follows?",
  o: ["Do not diagnose intellectual disability; adaptive functioning is intact, so look for other explanations of the school failure", "Diagnose mild intellectual disability because FSIQ is below 70", "Diagnose moderate intellectual disability", "Diagnose borderline intellectual functioning as a DSM-5-TR mental disorder", "Repeat the IQ test until the score exceeds 70"], a: 0,
  x: { core: "Intellectual disability requires BOTH intellectual and adaptive deficits, with developmental onset. With average adaptive functioning across informants, criterion B is not met. Consider the language of testing, acculturation, specific learning disorder, attention, emotional factors and schooling quality.",
    opts: ["Correct.",
      "IQ alone never suffices, and the confidence interval reaches 71.",
      "Severity is defined by adaptive functioning, which is average here.",
      "Borderline intellectual functioning is a condition that may be a focus of clinical attention, not a mental disorder, and it describes IQs of roughly 71–84.",
      "Retesting soon produces practice effects. Never test-shop."],
    contrast: "ID (intellectual + adaptive deficits) vs specific learning disorder (academic deficits with adequate general ability) vs low scores from mismatched norms.",
    root: "Adaptive behaviour as a construct goes back to Doll's Vineland Social Maturity Scale (1935), Vineland Training School, New Jersey.",
    image: "The ID door has two locks. He holds only one key.",
    hook: "No ADAPTIVE deficit, no ID: two locks, two keys.",
    depth: "A low IQ with good adaptive functioning should make you question test validity (language of testing, motivation, attention, anxiety, norms) and consider learning disorders or schooling factors. In Lebanon, crowded public schools, shifts in language of instruction and displacement can depress achievement. Report all three: IQ with CI, adaptive results, and the integrated conclusion.",
    beyond: "IQ and adaptive scores correlate only moderately (around .5), so discordant profiles are common. That is exactly why the dual criterion exists.",
    exam: "‘A child obtains an IQ of 66: discuss the diagnostic steps before concluding intellectual disability.’" } },
{ id: "spc8", c: "SPC", k: "spc_korff", L: 6, t: "written",
  q: "Professor-level: Using Simone Korff-Sausse's Le miroir brisé (1996), explain what the birth of a disabled child can do to parents' narcissistic investment, and how this would shape your work with a Lebanese family.",
  model: "Korff-Sausse argues that a child normally serves as a narcissistic mirror for the parents: they recognize themselves and their ideals in the baby (Freud's ‘His Majesty the Baby’, 1914). The disabled child breaks this mirror. Parents cannot find their reflection, which wounds parental narcissism and provokes strangeness (the uncanny), guilt, shame, and sometimes rejection or fusional overprotection. The imaginary child must be mourned while the real child is invested. Disability also mobilizes the clinician's countertransference: fascination, rejection, rescue fantasies. Clinical implications: create a space where ambivalence and even death wishes can be spoken without judgement; help parents rediscover resemblances and the child's own subjectivity beyond the disability; work with siblings; attend to transgenerational meanings. In Lebanon, inquire sensitively into extended-family pressure, stigma, religious explanations (trial, punishment), guilt about consanguinity, and the burden falling on mothers; coordinate with schools and institutions given limited services.",
  rubric: ["Explains the child as narcissistic mirror and the break (cites Korff-Sausse 1996)", "Mentions mourning the imaginary or ideal child", "Names key affects: guilt, shame, strangeness, ambivalence, overprotection or rejection", "Addresses the clinician's countertransference", "Gives a concrete clinical stance with parents and siblings", "Adapts to the Lebanese context (family, stigma, religion, consanguinity, services)"],
  x: { core: "Strong answers connect a psychoanalytic theory of parenthood to concrete clinical moves and local cultural factors.",
    root: "Le miroir brisé: l'enfant handicapé, sa famille et le psychanalyste (Calmann-Lévy, 1996). Narcissism comes from Ovid's Narcissus, who loved his reflection.",
    image: "A parent leaning over the cradle as over a pond, and the water cracks.",
    hook: "A broken MIRROR means mourning the MIRAGE child.",
    depth: "Related work: Maud Mannoni (L'enfant arriéré et sa mère, 1964) on the child as object of maternal fantasy; Solnit and Stark (1961) on ‘mourning the birth of a defective child’, the loss of the expected child.",
    beyond: "Korff-Sausse also wrote on how disability fascinates and frightens in art and culture, linking clinical work to representation: useful for viva questions on stigma.",
    exam: "LU-style: ‘Discuss the psychological impact of disability on the family from a psychodynamic perspective.’" } }
);

SEED.push(
{ id: "tls1", c: "TLS", k: "tls_distort", L: 1, t: "mcq",
  q: "A patient says: “If I don't get an A on this exam, I'm a total failure.” Which cognitive distortion is this primarily?",
  o: ["All-or-nothing (dichotomous) thinking", "Mind reading", "Personalization", "Emotional reasoning", "Disqualifying the positive"], a: 0,

    contrast: "All-or-nothing (two categories) vs overgeneralization (one event becomes ‘always’ or ‘never’).",
    root: "Beck (1963, 1967) described cognitive distortions in depression; Burns popularized the list in Feeling Good (1980).",

{ id: "tls2", c: "TLS", k: "tls_pfa", L: 2, t: "mcq",

      "Close to Hobfoll et al.'s (2007) five essential elements (safety, calming, self- and community efficacy, connectedness, hope), but not WHO's three action words.",

{ id: "tls3", c: "TLS", k: "tls_safety", L: 3, t: "mcq",

{ id: "tls4", c: "TLS", k: "tls_act", L: 3, t: "mcq",
  q: "In ACT, which process describes learning to see thoughts as passing mental events (“I'm having the thought that I'm worthless”) rather than literal truths?",
  o: ["Cognitive defusion", "Cognitive restructuring", "Acceptance", "Self-as-context", "Experiential avoidance"], a: 0,
  x: { core: "Defusion loosens the grip of verbal content by changing one's relationship to thoughts, not their content.",
    opts: ["Correct.",
      "Cognitive restructuring (Beck) changes the CONTENT by weighing evidence; ACT does not dispute thoughts.",
      "Acceptance is openness to inner experiences, especially emotions and sensations, without trying to control them.",

{ id: "tls5", c: "TLS", k: "tls_coping", L: 4, t: "vignette",
  q: "According to Lazarus and Folkman's transactional model, a nurse asking herself “Do I have the skills and support to manage this new ward?” is engaged in:",
  o: ["Secondary appraisal", "Primary appraisal", "Reappraisal", "Emotion-focused coping", "Problem-focused coping"], a: 0,

    opts: ["Correct.",
      "Primary appraisal evaluates what is at stake: irrelevant, benign-positive, or stressful (harm/loss, threat, challenge).",

    exam: "‘Explain the transactional model of stress and coping.’" } },
{ id: "tls6", c: "TLS", k: "tls_inhib", L: 5, t: "mcq",
  q: "Within Craske's inhibitory learning approach to exposure, which practice is most consistent with the model?",
  o: ["Designing exposures to maximally violate the patient's specific feared expectancy", "Ending each exposure only once fear has fully habituated", "Allowing safety behaviours so anxiety stays tolerable", "Always using the same context to consolidate learning", "Starting with the most feared item to flood the patient"], a: 0,
  x: { core: "Inhibitory learning holds that exposure creates a new non-threat association that competes with the old fear memory. Maximizing expectancy violation strengthens that new learning; fear does not need to fall within the session.",
    opts: ["Correct.",
      "Within-session habituation was central to emotional processing theory (Foa & Kozak) but does not reliably predict outcome.",

      "Variability across contexts improves retrieval of the new learning and reduces renewal.",

    contrast: "Emotional processing (habituate the fear) vs inhibitory learning (violate the expectancy, tolerate the fear).",
    root: "Craske et al. (2008; 2014), ‘Maximizing exposure therapy: An inhibitory learning approach’, Behaviour Research and Therapy.",
    image: "Posting a new road sign next to the old danger sign, and making it bigger every time the expected crash fails to happen.",
    hook: "SURPRISE beats SOOTHING: the brain learns from the gap between expected and actual.",

    beyond: "Reconsolidation-based protocols (Schiller et al., 2010: retrieval followed by extinction) try to modify the original memory itself; human replications have been mixed.",
    exam: "‘Compare habituation-based and inhibitory-learning accounts of exposure therapy.’" } },
{ id: "tls7", c: "TLS", k: "tls_autogenic", L: 4, t: "mcq",
  q: "Which description fits Schultz's autogenic training rather than Jacobson's progressive muscle relaxation?",

{ id: "tls8", c: "TLS", k: "tls_commonf", L: 6, t: "written",
  q: "Professor-level: Present Wampold's contextual model of psychotherapy versus the medical model. Name its three pathways, the evidence for it, the strongest counter-evidence, and what follows for how you choose techniques.",
  model: "The medical model holds that specific ingredients targeting a specific disorder produce the benefit. Wampold's contextual model (Wampold, 2001; Wampold & Imel, 2015) holds that therapy works through a socially embedded healing context with three pathways: (1) the real relationship, a genuine human connection; (2) expectations created by a convincing explanation and treatment rituals; (3) specific ingredients that lead the patient to carry out health-promoting actions. Evidence: small or null differences between bona fide treatments (Wampold et al., 1997; the ‘Dodo bird verdict’, after Rosenzweig, 1936), alliance–outcome correlations around r ≈ .28, therapist effects of about 5% or more of outcome variance, and empathy and expectation effects. Counter-evidence: exposure-based treatments outperform others for some anxiety disorders, OCD and PTSD; dismantling studies are mixed; researcher allegiance and study quality confound comparisons. Implication: choose techniques that are credible to this patient and coherent with a shared explanation, deliver them inside a strong alliance, measure outcomes and adapt, and keep specific techniques where evidence of specificity is strong.",
  rubric: ["Contrasts the medical and contextual models", "Names the three pathways (relationship, expectations, specific ingredients that drive health actions)", "Cites evidence (Dodo bird / bona fide comparisons, alliance r ≈ .28, therapist effects)", "Gives counter-evidence (exposure specificity, allegiance confounds)", "Derives practical implications for choosing techniques"],
  x: { core: "Top answers avoid ‘techniques don't matter’. They show when context dominates and when specificity matters.",
    root: "‘Dodo bird verdict’ comes from Alice in Wonderland: ‘Everybody has won, and all must have prizes’ (Rosenzweig, 1936; Luborsky et al., 1975).",
    image: "A placebo pill that works because of the hand that gives it, beside a real medicine that still needs the right dose.",
    hook: "Wampold's three Rs: Relationship, Rationale (expectations), Rituals that make you act.",
    depth: "Common factors trace back to Jerome Frank's Persuasion and Healing (1961): a confiding relationship, a healing setting, a rationale and a ritual. Wampold sharpened the case with meta-analyses. Critics such as Tolin (2010) found CBT superior to other therapies for anxiety and depression in some comparisons. Process-based therapy (Hofmann & Hayes) tries to move past the debate by targeting transdiagnostic processes.",
    beyond: "Therapist effects can exceed technique effects: Baldwin, Wampold and Imel (2007) found that therapists' contribution to the alliance, not patients', predicted outcome.",
    exam: "LU-style: ‘Specific vs common factors in psychotherapy: discuss.’" } }
);

{ id: "rm1", c: "RM", k: "rm_vars", L: 1, t: "mcq",
  q: "Researchers find that CBT reduces depression BECAUSE it reduces rumination. In this account, rumination is a:",
  o: ["Mediator", "Moderator", "Confounding variable", "Dependent variable", "Control variable"], a: 0,

    opts: ["Correct.",
      "A moderator changes the strength or direction of the IV–DV relation (e.g. CBT works better for women): WHEN or FOR WHOM.",
      "A confound is a third variable related to both IV and DV that offers an alternative explanation.",
      "The DV here is depression, the outcome.",
      "A control variable is held constant or adjusted for statistically."],
    contrast: "Mediator = mechanism (how/why); moderator = condition (when/for whom). Baron & Kenny (1986).",
    root: "Mediator: Latin medius, ‘middle’: it stands in the middle of the causal chain. Moderator: from ‘moderate’, to regulate strength.",
    image: "A row of dominoes: CBT knocks over rumination, which knocks over depression. A moderator is the tilt of the table that makes the chain fall faster or slower.",
    hook: "The MEDIATOR is in the MIDDLE; the MODERATOR MODULATES.",
    depth: "Modern mediation testing uses bootstrapped indirect effects (Preacher & Hayes; the PROCESS macro) rather than Baron and Kenny's causal steps. Causal mediation needs temporal precedence (measure the mediator before the outcome) and ideally manipulation; cross-sectional mediation is weak evidence.",
    beyond: "Kazdin's criteria for mechanisms of change in psychotherapy: strong association, specificity, consistency, experimental manipulation, timeline, gradient, plausibility.",
    exam: "‘Define and illustrate mediating and moderating variables.’" } },
{ id: "rm2", c: "RM", k: "rm_measure", L: 2, t: "mcq",
