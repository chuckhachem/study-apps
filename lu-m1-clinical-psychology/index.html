      "Expectancy could contribute, but selecting extreme scorers specifically invites regression.",
      "Attrition matters if dropouts differ, but nothing indicates dropout."],
    contrast: "Regression to the mean (an artefact of extreme selection) vs maturation (real change over time) vs history (outside events).",
    root: "Galton (1886): ‘regression towards mediocrity’ in hereditary stature.",
    image: "The tallest parents have tall children, but less extremely tall. A student's most anxious week is usually followed by a less extreme one.",
    hook: "EXTREMES RETREAT: what you pick at the edge rolls back toward the middle.",
    depth: "Campbell and Stanley's threats to internal validity: history, maturation, testing, instrumentation, statistical regression, selection, attrition, and selection interactions. Remedies: a randomized control group, multiple baselines, reliable measures, and selecting on a separate screening occasion.",
    beyond: "Much of the apparent response in uncontrolled clinical studies, and in placebo arms, is partly regression to the mean: one reason open trials overstate effects.",
    exam: "‘Explain three threats to internal validity with examples.’" } },
{ id: "rm4", c: "RM", k: "rm_validity4", L: 3, t: "mcq",
  q: "In Shadish, Cook and Campbell's typology, the question ‘Does our questionnaire really capture the construct of anxiety we claim to study?’ concerns:",
  o: ["Construct validity", "Internal validity", "External validity", "Statistical conclusion validity", "Ecological validity"], a: 0,
  x: { core: "Construct validity asks whether the operations (measures, manipulations) represent the higher-order constructs we name.",
    opts: ["Correct.",
      "Internal validity: did the IV cause the change in the DV?",
      "External validity: does the causal relation generalize across people, settings and times?",
      "Statistical conclusion validity: are the inferences about covariation correct (power, assumptions, error rates)?",
      "Ecological validity is an informal relative of external validity (realism of settings), not one of the four types."],
    contrast: "Construct validity (are we measuring what we say?) vs internal validity (did X cause Y?).",
    root: "Cook & Campbell (1979) introduced the four types; Shadish, Cook & Campbell (2002) refined them. Construct validity in testing: Cronbach & Meehl (1955).",
    image: "A thermometer labelled ‘anxiety’ that actually measures room temperature.",
    hook: "SICE the study from four sides: Statistical, Internal, Construct, External.",
    depth: "Trade-offs: tighter control (internal) often costs external validity; multiple measures and manipulation checks strengthen construct validity; power and assumption checks protect statistical conclusion validity. Cronbach and Meehl's nomological network defines construct validity through a construct's pattern of theoretical relations.",
    beyond: "Borsboom et al. (2004) argue validity is not about correlations at all: a test is valid if the attribute exists and causally produces variation in the scores, a realist redefinition.",
    exam: "‘Present the four types of validity in research design.’" } },
{ id: "rm5", c: "RM", k: "rm_thematic", L: 4, t: "mcq",
  q: "In Braun & Clarke's (2006) thematic analysis, what is phase 3?",
  o: ["Searching for themes (collating codes into candidate themes)", "Familiarizing yourself with the data", "Generating initial codes", "Reviewing themes", "Defining and naming themes"], a: 0,
  x: { core: "The six phases: (1) familiarization, (2) generating initial codes, (3) searching for themes, (4) reviewing themes, (5) defining and naming themes, (6) producing the report.",
    opts: ["Correct.",
      "Phase 1.",
      "Phase 2.",
      "Phase 4: checking themes against coded extracts and the whole data set.",
      "Phase 5."],
    contrast: "Thematic analysis (a flexible method, not tied to one theory) vs IPA (an idiographic, phenomenological methodology) vs grounded theory (theory generation by constant comparison).",
    root: "Braun & Clarke, Qualitative Research in Psychology (2006). Renamed ‘reflexive TA’ in 2019, when phase 3 became ‘generating initial themes’.",
    image: "Sorting a pile of sticky notes (codes) into clusters on a wall (themes), then checking each cluster holds together.",
    hook: "Families Can Search Rooms, Naming Windows: Familiarize, Code, Search, Review, Name, Write.",
    depth: "Reflexive TA treats researcher subjectivity as a resource, sees themes as constructed rather than ‘emerging’, and rejects coding-reliability statistics as inconsistent with the method. Braun and Clarke (2021) distinguish coding-reliability TA, codebook TA and reflexive TA.",
    beyond: "Braun and Clarke criticize the phrase ‘themes emerged’: themes don't sit in the data waiting to be found; analysts build them.",
    exam: "‘Describe the steps of thematic analysis and compare it with content analysis.’" } },
{ id: "rm6", c: "RM", k: "rm_power", L: 4, t: "mcq",
  q: "Which change would DECREASE the statistical power of a study, all else being equal?",
  o: ["Lowering alpha from .05 to .01", "Increasing the sample size", "Studying a larger true effect", "Reducing measurement error", "Using a one-tailed test in the correct direction"], a: 0,
  x: { core: "A stricter alpha shrinks the rejection region, which raises Type II error and lowers power.",
    opts: ["Correct.",
      "A larger n reduces the standard error: more power.",
      "Larger effects are easier to detect.",
      "Less noise increases the standardized effect size.",
      "A justified one-tailed test concentrates alpha in one tail: more power."],
    contrast: "Alpha (Type I error rate) vs beta (Type II error rate). Power = 1 − β, conventionally .80 (Cohen).",
    root: "Neyman & Pearson (1928, 1933) formalized power; Cohen (1962) showed psychology studies were badly underpowered.",
    image: "A metal detector: lowering alpha raises the beep threshold, so you miss more real coins.",
    hook: "A STRICTER alpha makes a WEAKER detector.",
    depth: "Power depends on effect size, n, alpha, directionality, design (within-subject designs add power) and reliability. A priori power analysis (G*Power) sets n. Post hoc ‘observed power’ is uninformative because it is a direct function of the p-value.",
    beyond: "Button et al. (2013) estimated median power in neuroscience at about 21%; low power not only misses effects but also inflates the effect sizes of significant findings (the winner's curse).",
    exam: "‘Define statistical power and list the factors that influence it.’" } },
{ id: "rm7", c: "RM", k: "rm_ethics", L: 5, t: "mcq",
  q: "The Belmont Report (1979) grounds research ethics in which three principles?",
  o: ["Respect for persons, beneficence, justice", "Autonomy, non-maleficence, fidelity", "Informed consent, confidentiality, debriefing", "Integrity, competence, responsibility", "Beneficence, equipoise, transparency"], a: 0,
  x: { core: "Belmont: respect for persons (autonomy, protection of those with diminished autonomy, hence informed consent), beneficence (do no harm, maximize benefits, hence risk–benefit assessment), justice (fair distribution of burdens and benefits, hence fair selection of participants).",
    opts: ["Correct.",
      "Beauchamp and Childress' biomedical principles are autonomy, non-maleficence, beneficence and justice; fidelity appears in other codes.",
      "These are procedures, not principles.",
      "Close to professional ethics codes (APA, BPS).",
      "Equipoise is a trial-design concept."],
    contrast: "Belmont (US, 1979, research) vs the Declaration of Helsinki (WMA, 1964, medical research) vs the Nuremberg Code (1947).",
    root: "Written after the Tuskegee syphilis study scandal by the US National Commission for the Protection of Human Subjects.",
    image: "Three pillars under a research building: a signature (respect), a scale weighing risk and benefit (beneficence), an even queue (justice).",
    hook: "R-B-J: Research Behaves Justly.",
    depth: "Applications: informed consent (information, comprehension, voluntariness), risk–benefit assessment, fair participant selection. With minors: parental permission plus the child's assent. In Lebanon, studies need ethics committee (IRB) approval, and the Ministry of Public Health's Circular 48 (2017) regulates mental-health research.",
    beyond: "Critics note Belmont's justice principle focused on protecting the vulnerable from burdens and neglected fair ACCESS to research benefits, a gap later addressed for women and minorities in trials.",
    exam: "‘Present the ethical principles of research with human participants and their application to a master's thesis.’" } },
{ id: "rm8", c: "RM", k: "rm_replic", L: 6, t: "written",
  q: "Viva: Explain the replication crisis in psychology (key evidence and causes) and design three concrete safeguards you will build into your own M2 thesis.",
  model: "The Open Science Collaboration (2015) replicated 100 studies from three psychology journals: 97% of the originals were significant vs about 36% of the replications, and replication effect sizes were roughly half the originals. Causes: low statistical power, publication bias (the file drawer), questionable research practices (p-hacking, optional stopping, flexible exclusions; Simmons, Nelson & Simonsohn, 2011), HARKing (hypothesizing after results are known; Kerr, 1998), small samples, weak theory and measurement, and incentives that reward novelty. Safeguards for my thesis: (1) preregister hypotheses, design, sample size and analysis plan (OSF or AsPredicted) before collecting data; (2) run an a priori power analysis in G*Power using a realistic, ideally conservative effect size from prior meta-analyses; (3) report all measures, exclusions and analyses, separate confirmatory from exploratory results, report effect sizes with confidence intervals, and share de-identified data and syntax where ethics allow. I will also use validated Arabic, English or French measures and report their reliability in my own sample.",
  rubric: ["Cites OSC 2015 with approximate figures (~36% replicated, effects about halved)", "Names at least three causes (power, publication bias, p-hacking, HARKing, incentives)", "Proposes preregistration", "Proposes an a priori power analysis", "Proposes transparent reporting (effect sizes, CIs, all measures, confirmatory vs exploratory, open data)"],
  x: { core: "Viva examiners reward specific numbers plus concrete, actionable safeguards.",
    root: "‘Crisis’ language spread after Bem's 2011 precognition paper and the Stapel fraud case (2011) shook confidence in the field.",
    image: "A house of cards built from single studies; replication is the open window.",
    hook: "PPP: Preregister, Power up, Publish everything.",
    depth: "Registered Reports (Chambers) accept papers before results exist, which removes publication bias. The Many Labs projects showed some effects replicate robustly while others (ego depletion, some priming effects) fail. Meta-science tools: p-curve, z-curve, funnel plots, Bayesian approaches.",
    beyond: "The problem reaches clinical trials too: registered psychotherapy trials are often selectively reported, and outcome switching inflates efficacy.",
    exam: "LU-style: ‘What is the replication crisis, and what are its implications for psychological research?’" } }
);
SEED.push(
{ id: "sp1", c: "SPSS", k: "sp_ttest", L: 2, t: "mcq",
  q: "In SPSS output for an independent-samples t-test, Levene's test gives F = 5.12, p = .03. Which row of the t-test table do you report?",
  o: ["“Equal variances not assumed” (Welch's t-test)", "“Equal variances assumed”", "Neither: switch to a paired t-test", "Neither: switch to chi-square", "Either row: Levene's test only matters for ANOVA"], a: 0,
  x: { core: "Levene's null hypothesis is equal variances. p < .05 rejects it, so you use the Welch-corrected row, which adjusts the degrees of freedom.",
    opts: ["Correct.",
      "Use this row only when Levene's p ≥ .05.",
      "A paired test is for related measurements, not for unequal variances.",
      "Chi-square is for categorical outcomes.",
      "Levene's test matters for the classical t-test too."],
    contrast: "Levene's test checks equal VARIANCES; Shapiro–Wilk checks NORMALITY.",
    root: "Levene (1960); Welch (1947), ‘The generalization of Student's problem when several different population variances are involved’.",
    image: "Two groups on a seesaw of variance: if Levene says it's unbalanced, Welch adds a counterweight to the df.",
    hook: "LEVENE LEVELS the variances; WELCH WELDS the fix.",
    depth: "Many methodologists (Delacre, Lakens & Leys, 2017) recommend Welch's t-test by default: it performs well when variances are equal and much better when they are not, especially with unequal group sizes. Report it as t(df) with decimal df, e.g. t(41.3) = 2.45, p = .019, d = 0.71.",
    beyond: "Using one significance test (Levene) to choose another inflates error rates. Defaulting to Welch avoids that conditional procedure.",
    exam: "‘Interpret an SPSS independent t-test output, including Levene's test.’" } },
{ id: "sp2", c: "SPSS", k: "sp_chooser", L: 2, t: "mcq",
  q: "You compare anxiety scores (continuous, clearly skewed, n = 12 per group) across three independent treatment groups. Which test is most appropriate?",
  o: ["Kruskal–Wallis H test", "One-way repeated-measures ANOVA", "Mann–Whitney U test", "Friedman test", "Pearson chi-square"], a: 0,
  x: { core: "Three independent groups with non-normal, small samples call for Kruskal–Wallis, the nonparametric counterpart of one-way ANOVA.",
    opts: ["Correct.",
      "Repeated measures means the same people are measured more than once.",
      "Mann–Whitney compares TWO independent groups.",
      "Friedman is the nonparametric repeated-measures test.",
      "Chi-square analyses frequencies of categories."],
    contrast: "Kruskal–Wallis (independent groups) vs Friedman (related measures).",
    root: "Kruskal & Wallis (1952), Journal of the American Statistical Association.",
    image: "Ranking runners from three clubs in one race, then comparing each club's average rank.",
    hook: "KRUSKAL for K groups of RANKS; FRIEDMAN for FRIENDS measured again.",
    depth: "Follow a significant H with Dunn's pairwise tests and a correction (Bonferroni or Holm). Effect size: epsilon-squared or eta-squared based on H. With moderate skew and about 15–20 per group, ANOVA is fairly robust; Welch's ANOVA handles unequal variances.",
    beyond: "Kruskal–Wallis tests stochastic dominance, not medians, unless the distributions share the same shape: a frequent misreport.",
    exam: "‘Choose and justify the appropriate statistical test for a given research design.’" } },
{ id: "sp3", c: "SPSS", k: "sp_effect", L: 3, t: "calc",
  q: "An independent-samples t-test with equal group sizes gives t(48) = 3.00. What is Cohen's d, approximately? (d ≈ 2t / √df)",
  o: ["0.87", "0.43", "1.73", "0.30", "0.06"], a: 0,
  x: { core: "d ≈ 2 × 3.00 / √48 = 6 / 6.93 ≈ 0.87: a large effect by Cohen's benchmarks (0.2 small, 0.5 medium, 0.8 large).",
    opts: ["Correct.",
      "0.43 is t/√df: half the correct value.",
      "1.73 is t/√3: an arithmetic slip.",
      "0.30 looks like a correlation-sized number, not d.",
      "0.06 confuses d with a p-value scale."],
    contrast: "d (standardized mean difference) vs r (correlation). Here r ≈ d / √(d² + 4) ≈ .40.",
    root: "Cohen (1962; 1988), Statistical Power Analysis for the Behavioral Sciences.",
    image: "Two overlapping bell curves sliding apart by 0.87 of a standard deviation.",
    hook: "DOUBLE the t, divide by the ROOT of df.",
    depth: "Exact formula for two independent groups: d = t√(1/n1 + 1/n2), which gives 0.85 here with n = 25 per group; 2t/√df is the quick approximation. Report effect sizes with 95% CIs. Hedges' g corrects d's small-sample bias. For patients, translate d into the probability of superiority or number needed to treat.",
    beyond: "Cohen warned his small/medium/large labels were a last resort. In psychotherapy research, d ≈ 0.2 between two active treatments can be clinically meaningful.",
    exam: "‘Compute and interpret an effect size from t-test output.’" } },
{ id: "sp4", c: "SPSS", k: "sp_chi", L: 3, t: "mcq",
  q: "In a 2 × 2 table testing whether a diagnosis (yes/no) differs by sex, two cells have expected counts below 5. What should you report?",
  o: ["Fisher's exact test", "Pearson chi-square anyway", "An independent t-test", "McNemar's test", "Cramér's V only, without a test"], a: 0,
  x: { core: "The chi-square approximation becomes inaccurate when more than 20% of cells have expected counts below 5. For 2 × 2 tables, Fisher's exact test computes the exact probability.",
    opts: ["Correct.",
      "Pearson's approximation is unreliable here.",
      "A t-test needs a continuous outcome.",
      "McNemar is for paired dichotomous data (before/after in the same people).",
      "Cramér's V is an effect size; you still need inference."],
    contrast: "Fisher (independent groups, small counts) vs McNemar (paired before/after data).",
    root: "R. A. Fisher (1922; 1935), and the ‘lady tasting tea’ experiment.",
    image: "A lady tastes eight cups of tea; Fisher calculates the exact odds of guessing them all by chance.",
    hook: "Call FISHER for SMALL fish counts.",
    depth: "SPSS prints ‘x cells (y%) have expected count less than 5’ under the chi-square table: always check it. Report χ²(df, N = n) = value, p, plus an effect size (phi for 2 × 2, Cramér's V otherwise). Standardized residuals beyond ±1.96 show which cells drive the effect.",
    beyond: "The ‘expected < 5’ rule is conservative; Campbell (2007) argued the ‘N − 1’ chi-square performs well for most 2 × 2 tables. Fisher remains the safe exam answer.",
    exam: "‘Read an SPSS crosstab output and choose the appropriate test.’" } },
{ id: "sp5", c: "SPSS", k: "sp_rm", L: 4, t: "mcq",
  q: "In a repeated-measures ANOVA (anxiety at 4 time points), Mauchly's test is significant and the Greenhouse–Geisser ε = .62. What do you do?",
  o: ["Report the Greenhouse–Geisser corrected F and df", "Ignore it and report the sphericity-assumed F", "Switch to an independent-samples ANOVA", "Use Huynh–Feldt because ε < .75", "Drop one time point until Mauchly's test is non-significant"], a: 0,
  x: { core: "A significant Mauchly's test means sphericity is violated and the F test is too liberal. Correct the df by ε. With ε < .75, Greenhouse–Geisser is recommended; Huynh–Feldt when ε > .75 (Girden, 1992).",
    opts: ["Correct.",
      "The sphericity-assumed F inflates the Type I error rate.",
      "The measures are related; an independent ANOVA ignores that.",
      "Reversed: Huynh–Feldt is for ε > .75.",
      "That is data dredging; besides, Mauchly's test is underpowered in small samples and overpowered in large ones."],
    contrast: "Sphericity (equal variances of the difference scores) vs homogeneity of variance (between groups).",
    root: "Greenhouse & Geisser (1959); Mauchly (1940).",
    image: "A wheel that isn't round: ε says how oval it is, and you shorten the trip (the df) to match.",
    hook: "GG for a GROSS violation (ε < .75); HF for a HALF-mild one.",
    depth: "Corrected df = ε × the original df, e.g. F(1.86, 53.9). Alternatives: the multivariate approach (SPSS's MANOVA output) and linear mixed models, which handle missing data and relax sphericity. Always report ε.",
    beyond: "Many statisticians suggest skipping Mauchly's test and always applying the Greenhouse–Geisser correction, because Mauchly's test is unreliable.",
    exam: "‘Interpret a repeated-measures ANOVA output, including Mauchly's test.’" } },
{ id: "sp6", c: "SPSS", k: "sp_assump", L: 4, t: "mcq",
  q: "In a multiple regression predicting depression from rumination, worry and neuroticism, SPSS shows VIF = 11.2 for worry. What does this indicate?",
  o: ["Problematic multicollinearity: worry is highly predictable from the other predictors", "Heteroscedasticity of the residuals", "Non-normal residuals", "Autocorrelated errors", "An influential outlier"], a: 0,
  x: { core: "VIF = 1/(1 − R²) for a predictor regressed on the others. A VIF of 11.2 means R² ≈ .91: worry overlaps heavily with rumination and neuroticism, which inflates its standard error.",
    opts: ["Correct.",
      "Heteroscedasticity: check the residuals-vs-predicted plot for a funnel shape.",
      "Normality: check the P–P plot or histogram of residuals.",
      "Autocorrelation: Durbin–Watson.",
      "Influence: Cook's distance, leverage."],
    contrast: "VIF/tolerance (multicollinearity) vs Durbin–Watson (independence of errors) vs Cook's D (influence).",
    root: "Variance Inflation Factor: literally how much collinearity inflates the variance of a coefficient.",
    image: "Three people pushing the same car: you cannot tell who did the work.",
    hook: "VIF over TEN, think AGAIN (some use 5).",
    depth: "Tolerance = 1/VIF; below .10 is alarming. Remedies: drop or combine predictors, centre variables for interactions, let theory pick one, or use regularized regression. Multicollinearity does not bias overall prediction; it destabilizes individual coefficients.",
    beyond: "Rumination and worry may share a transdiagnostic ‘repetitive negative thinking’ factor (Ehring & Watkins, 2008); here collinearity is a theoretical signal, not just a statistical nuisance.",
    exam: "‘List the assumptions of multiple regression and how to check each in SPSS.’" } },
{ id: "sp7", c: "SPSS", k: "sp_efa", L: 5, t: "mcq",
  q: "Before an exploratory factor analysis of a new Arabic anxiety questionnaire, SPSS gives KMO = .45 and Bartlett's test p < .001. What should you conclude?",

    hook: "KMO below FIFTY makes factors SHIFTY.",

    beyond: "For Likert items, factor-analysing polychoric correlations (e.g. in FACTOR or R) is often better than SPSS's Pearson-based EFA.",
    exam: "‘Describe the steps of an exploratory factor analysis in SPSS and interpret KMO and Bartlett's test.’" } },
{ id: "sp8", c: "SPSS", k: "sp_apa", L: 6, t: "written",
  q: "Write an APA 7 results paragraph for: CBT group (n = 25) M = 14.2, SD = 5.1; waitlist (n = 25) M = 19.8, SD = 6.3 on the BDI-II at post-test. Independent t-test: t(48) = −3.45, p = .001, d = 0.98, 95% CI of the difference [−8.86, −2.34].",

  rubric: ["States the test used and the direction of the effect in words", "Reports M and SD for both groups", "Reports t with df and the exact p (p = .001)", "Reports the effect size and confidence interval", "Interprets the magnitude without overclaiming beyond a waitlist design"],

);

  q: "You are the psychology intern. During your session, a ward patient on lithium shows a new coarse tremor, vomiting, an unsteady gait and confusion. What do you do?",
  o: ["Stop the session and alert the medical team immediately: these suggest lithium toxicity", "Note it in your report for the next weekly meeting", "Advise the patient to skip his next lithium dose", "Explore the confusion as a dissociative response to the session", "Reassure him that tremor is a normal side effect"], a: 0,
  x: { core: "Coarse tremor, gastrointestinal symptoms, ataxia and confusion are classic signs of lithium toxicity, a medical emergency given lithium's narrow therapeutic index. Your role is to recognize and escalate, not to treat.",
    opts: ["Correct.",
      "Delay could be dangerous.",
      "Medication advice is outside a psychologist's scope (and Law 8/2017).",
      "Psychologizing a medical emergency is a classic, dangerous error.",
      "A FINE tremor is common at therapeutic levels; a COARSE tremor with confusion and ataxia is not."],
    contrast: "Fine tremor (common at therapeutic levels) vs coarse tremor with ataxia and confusion (toxicity).",
    root: "Lithium: Greek lithos, ‘stone’. Cade (1949) discovered its antimanic effect.",
    image: "A stone (lithos) rattling the hand (coarse tremor), tipping the walk (ataxia) and fogging the head (confusion).",
    hook: "The four Ts of lithium toxicity: Tremor, Tumbling, Talking nonsense, Throwing up.",
    depth: "Therapeutic levels are roughly 0.6–1.0 mmol/L (sometimes up to 1.2); toxicity is common above 1.5. Precipitants: dehydration, vomiting or diarrhoea, NSAIDs, ACE inhibitors, thiazide diuretics, renal impairment, low-salt diets. Severe toxicity brings seizures, arrhythmias and coma, and may need haemodialysis.",
    beyond: "Lithium has robust anti-suicidal effects in mood disorders (Cipriani et al., 2013), which is why adherence matters and toxicity must be caught early rather than leading to discontinuation.",
    exam: "‘Describe the psychologist's role in a multidisciplinary team when medical complications appear.’" } },
{ id: "ci4", c: "CI", k: "ci_pharm", L: 5, t: "vignette",
  q: "A patient recently started on an SSRI and given tramadol develops agitation, sweating, hyperreflexia and inducible clonus within 24 hours. The most likely diagnosis is:",
  o: ["Serotonin syndrome", "Neuroleptic malignant syndrome", "Akathisia", "Anticholinergic delirium", "Catatonia"], a: 0,
  x: { core: "Rapid onset after a serotonergic combination, with neuromuscular hyperactivity (clonus, hyperreflexia), autonomic signs and agitation, is serotonin syndrome (Hunter criteria).",
    opts: ["Correct.",
      "NMS follows dopamine antagonists, develops over days, with lead-pipe rigidity, reduced reflexes, high CK and high fever.",
      "Akathisia is inner restlessness and pacing, without autonomic instability or clonus.",
      "Anticholinergic toxicity: hot, dry, flushed skin, dilated pupils, urinary retention (‘dry as a bone’; serotonin syndrome is sweaty).",
      "Catatonia: mutism, posturing, waxy flexibility; it can overlap with NMS (malignant catatonia)."],
    contrast: "Serotonin syndrome (hours, clonus and hyperreflexia, sweaty) vs NMS (days, rigidity and hyporeflexia).",
    root: "Hunter Serotonin Toxicity Criteria (Dunkley et al., 2003). Tramadol is also a weak serotonin reuptake inhibitor.",
    image: "A shaking, sweating sprinter (serotonin syndrome) vs a stiff, feverish wooden statue (NMS).",
    hook: "SS: Shivering, Sweating, Speedy. NMS: the Neuroleptic Makes you Stiff.",
    depth: "Hunter criteria: a serotonergic agent plus spontaneous clonus; or inducible clonus with agitation or diaphoresis; or ocular clonus with agitation or diaphoresis; or tremor with hyperreflexia; or hypertonia with temperature above 38 °C and ocular or inducible clonus. Management: stop the agents, supportive care, cyproheptadine in moderate cases. Your role as psychologist: recognize, escalate, document.",
    beyond: "Linezolid and methylene blue are MAO inhibitors that can trigger serotonin syndrome in patients on SSRIs: a classic hospital interaction.",
    exam: "‘Recognizing medical emergencies in psychiatric settings: the psychologist's role.’" } },
{ id: "ci5", c: "CI", k: "ci_icd", L: 4, t: "mcq",
  q: "How does ICD-11 classify personality disorder, compared with the DSM-5-TR main section?",
  o: ["One personality disorder graded by severity (mild, moderate, severe), with optional trait-domain specifiers and a borderline pattern specifier", "Ten categorical personality disorders grouped in three clusters", "Personality disorders are removed entirely", "Only antisocial and borderline personality disorders are retained", "A five-factor model replaces diagnosis"], a: 0,
  x: { core: "ICD-11 (WHO, in effect since 2022) replaced the categories with a single diagnosis rated by severity, plus trait domains (negative affectivity, detachment, dissociality, disinhibition, anankastia) and an optional borderline pattern.",
    opts: ["Correct.",
      "That is DSM-5-TR Section II (clusters A, B, C).",
      "False: personality disorder remains, with ‘personality difficulty’ as a subthreshold category.",
      "False.",
      "The trait domains are partly inspired by the five-factor model, but they are specifiers, not a replacement."],
    contrast: "ICD-11 (dimensional severity + traits) vs DSM-5-TR Section II (10 categories) vs DSM-5-TR's Section III alternative model (personality functioning + 5 pathological trait domains, including psychoticism).",
    root: "Developed by Tyrer and colleagues. Anankastia: Greek anankē, ‘necessity, compulsion’.",
    image: "Ten labelled boxes melted down into one dial (severity) with five coloured stickers (traits).",
    hook: "‘Never Dance Drunk, Dear Anankē’: Negative affectivity, Detachment, Dissociality, Disinhibition, Anankastia.",
    depth: "Severity rests on dysfunction in the self (identity, self-worth, self-direction) and in interpersonal functioning, plus emotional, cognitive and behavioural manifestations and distress or impairment. DSM-5-TR's alternative model has psychoticism instead of anankastia. Research supports the reliability of the dimensional approach and its handling of comorbidity.",
    beyond: "The borderline pattern specifier was a compromise to keep continuity with the treatment evidence base for BPD (DBT, MBT, TFP, schema therapy).",
    exam: "‘Compare categorical and dimensional approaches to personality disorders.’" } },
{ id: "ci6", c: "CI", k: "ci_ctt", L: 4, t: "vignette",
  q: "With a patient who was harshly criticized by his father, you notice yourself feeling irritated and critical, wanting to reprimand him. In Racker's terms this is:",
  o: ["Complementary identification", "Concordant identification", "Projective counter-identification", "Countertransference neurosis", "Empathic attunement"], a: 0,
  x: { core: "In complementary identification the clinician identifies with the patient's internal objects (here the critical father) and feels toward the patient as that object did.",
    opts: ["Correct.",
      "Concordant identification: identifying with the patient's own ego and feelings (feeling his humiliation).",
      "Grinberg's (1962) concept: the analyst passively reacts to the patient's projective identification, ‘becoming’ the projected part.",
      "Racker's term for the analyst's own infantile conflicts reactivated by the work.",
      "Attunement is resonance with the patient's affect, closer to concordance."],
    contrast: "Concordant: I feel what HE feels. Complementary: I feel what his OBJECT felt toward him.",
    root: "Heinrich Racker, Transference and Countertransference (1968, from 1950s papers). Freud introduced countertransference (1910); Heimann (1950) reframed it as a clinical tool.",
    image: "Two mirrors: one shows the patient's face (concordant), the other shows his father's face looking at him (complementary).",
    hook: "CONCORDANT shares the same heart (cor); COMPLEMENTARY COMPLETES the old pair.",
    depth: "Using it: notice, contain, do not enact (avoid repeating the reprimand), formulate (this may be how others react to him, a repeating relational pattern), and use it to inform interpretation or planning. Bring it to supervision. Ogden and Bollas extended the clinical use of countertransference.",
    beyond: "Relational analysts (Mitchell, Benjamin) treat such enactments as inevitable co-constructions: the work is recognizing and repairing them, not avoiding them entirely.",
    exam: "‘Define countertransference and illustrate its clinical use.’" } },
{ id: "ci7", c: "CI", k: "ci_pdm", L: 5, t: "mcq",
  q: "The PDM-2 (Psychodynamic Diagnostic Manual, 2017) organizes adult diagnosis along which three axes?",
  o: ["P (personality syndromes), M (profile of mental functioning), S (symptom patterns as subjectively experienced)", "Clinical disorders, personality, medical conditions", "Structure, defences, drives", "Severity, trait domains, borderline pattern", "Neurosis, psychosis, perversion"], a: 0,
  x: { core: "The PDM-2 adult section: the P-Axis (personality level and styles), the M-Axis (12 capacities of mental functioning) and the S-Axis (symptom patterns described from the patient's subjective experience).",
    opts: ["Correct.",
      "Roughly DSM-IV's multiaxial Axes I–III.",
      "Freudian metapsychological concepts, not PDM axes.",
      "The ICD-11 personality disorder structure.",
      "Lacanian structural diagnosis."],
    contrast: "PDM-2 describes the person's functioning; DSM classifies disorders.",
    root: "Lingiardi & McWilliams (eds.), PDM-2 (Guilford, 2017); first edition 2006.",
    image: "A three-layer map: the terrain (personality), the quality of the roads (mental capacities), and the weather the traveller feels (symptoms).",
    hook: "PMS: Personality, Mental functioning, Subjective symptoms.",
    depth: "Levels of personality organization: healthy, neurotic, borderline, psychotic (Kernberg-influenced). M-Axis capacities include regulation, attention and learning; affective range and communication; mentalization; identity; relationships and intimacy; self-esteem regulation; impulse control; defensive functioning; adaptation and resilience; self-observation; internal standards; meaning and purpose. The PDC-2 helps clinicians rate them.",
    beyond: "Unlike DSM, PDM-2 has separate sections for infancy, childhood, adolescence and later life, and its S-Axis describes the clinician's typical subjective responses (countertransference) to each symptom pattern.",
    exam: "‘Present the PDM-2 and its contribution to clinical diagnosis.’" } },
{ id: "ci8", c: "CI", k: "ci_psydyn", L: 6, t: "written",
  q: "Case for formulation: Maya, 28, Beirut, bank employee, admitted after an overdose following the end of a relationship. History of intense, unstable relationships, fear of abandonment, self-criticism; father emotionally absent and unpredictable; mother anxious and intrusive. Since the 2019 crisis she has supported her family financially. Write a combined 5 Ps + psychodynamic formulation (one paragraph each) and name two treatment implications.",
  model: "5 Ps. Presenting: an overdose after a breakup, mood instability, fear of abandonment, self-criticism. Predisposing: inconsistent early care (an unpredictable father, an intrusive, anxious mother) and probable temperamental emotional sensitivity. Precipitating: the end of the relationship. Perpetuating: chronic financial pressure and a caretaking role since 2019, isolation, self-criticism, impulsive coping. Protective: employment, intelligence, help-seeking after admission, family ties. Psychodynamic: her functioning suggests a borderline level of personality organization with identity diffusion, splitting and abandonment fears. Her internal object relations alternate between an idealized rescuing other and an abandoning or rejecting one; the breakup reactivated the abandoned-self/rejecting-object dyad, and the overdose may express both rage turned inward and a plea for care. A harsh, self-critical superego internalizes the unpredictable father. Her parentified role since the crisis repeats a pattern of caring for others while her own needs go unmet. Implications: (1) prioritize safety planning and a stable frame with clear limits (DBT, or MBT/TFP-informed treatment); (2) anticipate abandonment themes in the transference around breaks and endings and mentalize these moments; involve the family carefully, reducing intrusion while keeping support.",
  rubric: ["Completes all five Ps with case-grounded content", "Proposes a level of organization and key defences or object relations", "Links past relationships to the precipitant (repetition) and to the meaning of the overdose", "Includes the cultural and economic context (2019 crisis, family role)", "Gives two concrete treatment implications, including safety", "Uses tentative, hypothesis-based language"],
  x: { core: "A formulation is a mechanism, not a list: why HER, why NOW, why it CONTINUES, and what it predicts for treatment.",
    root: "Kernberg's levels of personality organization (1975, 1984); McWilliams, Psychoanalytic Case Formulation (1999).",
    image: "Two transparent overlays on the same map: the 5 Ps grid and the object-relations drama.",
    hook: "Formulation = Facts + Fabric + Forecast.",
    depth: "Good formulations are parsimonious and testable (they predict the transference and responses to intervention), and they can be shared with the patient in plain language. Avoid walls of jargon; include strengths. On a ward, align the formulation with the team's diagnostic and risk plan.",
    beyond: "Mentalization-based treatment (Bateman & Fonagy) and DBT both have RCT support for borderline presentations, and both stress a predictable frame: the most protective element for Maya.",
    exam: "LU-style: ‘Present a clinical case and propose a diagnostic and psychodynamic understanding.’" } }
);

{ id: "act8", c: "ACT", k: "act_flynn", L: 7, t: "vignette",
  q: "A man assessed for intellectual disability in 2025 with a test normed in 2010 obtains FSIQ 72. Given the Flynn effect, what is the most defensible statement?",
  o: ["His score is probably inflated by about 4–5 points relative to current norms, so a current-norm score near 67–68 is plausible and ID cannot be ruled out on this score alone", "His true IQ is certainly 67: subtract 5 points and diagnose ID", "Old norms lower scores, so on current norms he would score about 77", "The Flynn effect only affects fluid tests like Raven's, so a Wechsler score is unaffected", "Norm age is irrelevant once the SEM is reported"], a: 0,
  x: { core: "Population gains of about 3 IQ points per decade (Flynn, 1984, 1987) mean an older norm group would score lower than today's population. Old norms are therefore ‘easier’ and inflate scores by roughly 0.3 points per year: about 4–5 points over 15 years. Near the ID threshold that shift matters, so the decision must rest on current norms plus adaptive functioning.",
    opts: ["Correct: estimate the drift, keep it tentative, and integrate adaptive functioning.",
      "Overconfident: Flynn corrections are estimates, they are contested, and a score alone never makes an ID diagnosis without adaptive deficits.",
      "Reversed: old norms INFLATE scores; they do not lower them.",
      "Gains are largest on fluid tests but present on Wechsler and Binet composites too; Flynn's own data included them.",
      "The SEM covers random error. Norm obsolescence is a systematic, one-directional bias the SEM does not capture."],
    contrast: "Random error (SEM: a symmetric band around the score) vs systematic bias (norm drift: pushes scores one way).",
    root: "Named ‘the Flynn effect’ by Herrnstein and Murray (1994), after James R. Flynn, the New Zealand political scientist who documented it across 14 nations (1987).",
    image: "Whole populations riding an escalator. An old norm table is a photo of the crowd taken from a lower step.",
    hook: "FLYNN scores FLY up about three points a decade, so old norms flatter.",
    depth: "Proposed explanations: better nutrition and health; more and better schooling; greater environmental complexity and test familiarity; Flynn's ‘scientific spectacles’ (habits of abstraction and classification); the Dickens–Flynn model of gene–environment multipliers. Gains are largest on fluid, abstract tasks and smallest on vocabulary and arithmetic; Wicherts et al. (2004) showed measurement invariance fails across cohorts, so the gains are not purely on g. Since the 1990s, Norway, Denmark and Finland show a stall or reversal, and within-family analyses of Norwegian conscripts (Bratsberg & Rogeberg, 2018) point to environmental causes. Safeguards: use the newest norms, report the norm date, discuss any correction cautiously, and weigh adaptive functioning.",
    beyond: "Arab-region norm data are sparse and often imported, so norm drift and cultural mismatch can compound each other: a strong argument for local norming projects in Lebanon.",
    exam: "LU-style essay: ‘Define the Flynn effect and discuss its implications for psychometric assessment.’ Aim for definition + size + two explanations + one clinical consequence." } },
{ id: "int8", c: "INT", k: "int_french", L: 6, t: "mcq",
  q: "Which statement best contrasts the open clinical interview of the French psychodynamic tradition (e.g. Colette Chiland) with a structured diagnostic interview such as the SCID-5?",
  o: ["The open interview studies the singular subject's discourse and treats the relationship as data, trading reliability for depth; the SCID-5 trades depth for reliable, DSM-anchored categorical diagnosis", "The open interview is fully structured, while the SCID-5 is non-directive", "Both aim mainly at reliable DSM diagnoses and differ only in length", "The SCID-5 is designed to explore transference and defensive organization", "The open interview has no place in psychiatric hospitals"], a: 0,
  x: { core: "The French clinical interview (Chiland, L'entretien clinique, 1983; Bénony & Chahraoui) is non- or semi-directive: the clinician offers a frame so the subject's discourse, associations, silences and relational movements can emerge, and the relationship itself is data. The SCID-5 (First et al., 2016) is semi-structured and DSM-anchored, with fixed probes and criterion-based scoring. Each buys something by giving something up.",
    opts: ["Correct.",
      "Reversed.",
      "Only the SCID-5 aims at reliable DSM diagnosis; the open interview aims at understanding psychic functioning.",
      "No: that describes Kernberg's structural interview (1984), which probes identity, defences and reality testing in a semi-structured way. The right answer if asked which interview assesses personality organization.",
      "False: on French-influenced and Lebanese wards it is the usual form of first contact, alliance building and psychotherapy indication."],
    contrast: "The open interview (meaning, singularity, low reliability) vs the SCID-5 (categories, reliability, risk of reducing the person to criteria). Kernberg's structural interview sits between them.",
    root: "Clinical: Greek klinē, ‘bed’: knowledge gained at the patient's bedside, the root of the ‘méthode clinique’.",
    image: "A landscape painter (open interview) and a surveyor with a theodolite (SCID) mapping the same mountain; each misses what the other sees.",
    hook: "KLINĒ is the bedside; SCID is the scaffolding.",
    depth: "Risks of the open interview: low inter-rater reliability, dependence on the clinician's theory and countertransference, and missed specific symptoms (unasked psychotic or manic features, risk). Risks of the SCID-5: a stilted alliance, cultural mismatch in item wording, false positives if probes are taken literally. Best practice in a Lebanese hospital combines them: an open beginning, focused probes for differential diagnosis and risk, and a closing that returns to the patient's words. Structured tools fit research, diagnostic clarification and medico-legal questions. Historically, Lagache's L'unité de la psychologie (1949) institutionalized the clinical method in France, while structured interviews grew from the reliability crisis exposed by the US–UK Diagnostic Project (1972) and Rosenhan (1973), leading to DSM-III (1980).",
    beyond: "Rosenhan's ‘On being sane in insane places’ has been seriously challenged (Cahalan, The Great Pretender, 2019), which questions whether the pseudopatient study happened as reported.",
    exam: "LU-style: ‘Compare non-directive and structured interviews: advantages, limits, indications.’" } },
{ id: "spc8", c: "SPC", k: "spc_korff", L: 6, t: "mcq",
  q: "In Le miroir brisé (1996), what does Simone Korff-Sausse argue the birth of a disabled child does to the parents?",
  o: ["It breaks the narcissistic mirror in which parents recognize themselves in their child, wounding parental narcissism and requiring mourning of the imagined child", "It inevitably triggers parental psychosis", "It strengthens parental narcissism because the child needs them more", "It has no specific psychic effect once a medical diagnosis is given", "It proves that disability is purely a social construction"], a: 0,
  x: { core: "A child normally serves as a narcissistic mirror: parents find themselves and their ideals in the baby (Freud's ‘His Majesty the Baby’, 1914). The disabled child breaks this mirror, bringing strangeness (the uncanny), guilt, shame, ambivalence, and sometimes rejection or fusional overprotection. The imaginary child must be mourned while the real child is invested.",
    opts: ["Correct.",
      "An overstatement: the wound is narcissistic and painful, not a psychosis.",
      "Reversed: overprotection may look like heightened investment, but it is usually a defence against the narcissistic wound and ambivalence.",
      "A diagnosis names the condition; it does not resolve the psychic wound, though it may start the work of mourning.",
      "That is the strong social model's claim, not Korff-Sausse's psychoanalytic one."],
    contrast: "Solnit & Stark (1961): mourning the expected child. Olshansky (1962): chronic sorrow re-triggered at milestones. Korff-Sausse (1996): the broken narcissistic mirror.",
    root: "Le miroir brisé: l'enfant handicapé, sa famille et le psychanalyste (Calmann-Lévy, 1996). Narcissism comes from Ovid's Narcissus, who loved his reflection.",
    image: "A parent leaning over the cradle as over a pond, and the water cracks.",
    hook: "A broken MIRROR means mourning the MIRAGE child.",
    depth: "Clinical implications: create a space where ambivalence and even death wishes can be spoken without judgement; help parents rediscover resemblances and the child's own subjectivity beyond the disability; work with siblings; attend to transgenerational meanings; watch your own countertransference (fascination, rejection, rescue fantasies). In Lebanon, inquire sensitively into extended-family pressure, stigma, religious explanations (trial, punishment), guilt about consanguinity, and the burden falling on mothers, and coordinate with schools given limited services. Related work: Maud Mannoni, L'enfant arriéré et sa mère (1964).",
    beyond: "Korff-Sausse also wrote on how disability fascinates and frightens in art and culture, linking clinical work to representation: useful for viva questions on stigma.",
    exam: "LU-style: ‘Discuss the psychological impact of disability on the family from a psychodynamic perspective.’" } },
{ id: "tls8", c: "TLS", k: "tls_commonf", L: 6, t: "mcq",
  q: "Which set correctly names the three pathways of Wampold's contextual model of psychotherapy?",
  o: ["The real relationship; expectations created by a credible explanation and ritual; specific ingredients that lead the patient to health-promoting actions", "Congruence, unconditional positive regard, empathic understanding", "Insight, catharsis, working through", "Exposure, cognitive restructuring, behavioural activation", "Assessment, intervention, termination"], a: 0,
  x: { core: "Wampold's contextual model (Wampold, 2001; Wampold & Imel, 2015) holds that therapy works through a socially embedded healing context with three pathways: a genuine human relationship, expectations created by a convincing explanation and treatment rituals, and specific ingredients that get the patient to carry out health-promoting actions.",
    opts: ["Correct.",
      "Rogers' therapist conditions (1957): related to the relationship pathway, but not Wampold's model.",
      "Classical psychoanalytic mechanisms of change.",
      "Specific CBT ingredients: the medical model's emphasis.",
      "Phases of treatment, not mechanisms."],
    contrast: "Medical model (specific ingredients cure specific disorders) vs contextual model (the healing context drives most change; specific ingredients act partly through it).",
    root: "‘Dodo bird verdict’ comes from Alice in Wonderland: ‘Everybody has won, and all must have prizes’ (Rosenzweig, 1936; Luborsky et al., 1975). Jerome Frank's Persuasion and Healing (1961) is the ancestor.",
    image: "A placebo pill that works because of the hand that gives it, beside a real medicine that still needs the right dose.",
    hook: "Wampold's three Rs: Relationship, Rationale (expectations), Rituals that make you act.",
    depth: "Evidence for: small or null differences between bona fide treatments (Wampold et al., 1997), alliance–outcome correlations around r ≈ .28, therapist effects of about 5% or more of outcome variance. Counter-evidence: exposure-based treatments outperform others for some anxiety disorders, OCD and PTSD; Tolin (2010) found CBT superior in some comparisons; allegiance and study quality confound results. Practical upshot: pick techniques credible to this patient, coherent with a shared explanation, delivered within a strong alliance; measure outcomes; keep specific techniques where specificity is proven.",
    beyond: "Baldwin, Wampold and Imel (2007) found that therapists' contribution to the alliance, not patients', predicted outcome.",
    exam: "LU-style: ‘Specific vs common factors in psychotherapy: discuss.’" } },
{ id: "rm8", c: "RM", k: "rm_replic", L: 6, t: "mcq",
  q: "In the Open Science Collaboration's (2015) attempt to replicate 100 psychology studies, roughly what proportion of the replications produced statistically significant results?",
  o: ["About 36%", "About 97%", "About 80%", "About 5%", "About 47%"], a: 0,
  x: { core: "About 36% of replications were significant, against 97% of the originals, and replication effect sizes were on average about half the original ones.",
    opts: ["Correct.",
      "97% is the share of ORIGINAL studies that reported significant results.",
      "80% is the conventional power target (Cohen); well-powered replications of true effects should succeed about that often.",
      "5% is alpha: roughly what you would expect if every original effect were null.",
      "47% is a different metric: the share of original effect sizes that fell inside the replication's 95% confidence interval."],
    contrast: "Significance-based replication rate (36%) vs effect-size-based measures (47% inside the CI; effects halved).",
    root: "‘Crisis’ language spread after Bem's 2011 precognition paper and the Stapel fraud case (2011). OSC 2015, Science.",
    image: "A house of cards built from single studies; replication is the open window.",
    hook: "Thirty-six of a hundred stood up: ‘3-6 pick up sticks’, most fell.",
    depth: "Causes: low power, publication bias, questionable research practices (p-hacking, optional stopping, flexible exclusions; Simmons, Nelson & Simonsohn, 2011), HARKing (Kerr, 1998), weak theory and measurement, incentives for novelty. Safeguards for your own thesis: preregistration (OSF, AsPredicted), an a priori power analysis in G*Power with a conservative effect size, full transparent reporting (all measures, exclusions, effect sizes with CIs, confirmatory vs exploratory), validated measures with reliability reported in your own sample. Registered Reports (Chambers) remove publication bias by accepting papers before results.",
    beyond: "The Many Labs projects showed some effects replicate robustly while others (ego depletion, some priming effects) fail; clinical trials suffer from outcome switching too.",
    exam: "LU-style: ‘What is the replication crisis, and what are its implications for psychological research?’" } },
{ id: "sp8", c: "SPSS", k: "sp_apa", L: 6, t: "mcq",
  q: "CBT (n = 25, M = 14.2, SD = 5.1) vs waitlist (n = 25, M = 19.8, SD = 6.3) on the BDI-II at post-test; t(48) = −3.45, p = .001, d = 0.98. Which sentence reports this correctly in APA 7?",
  o: ["Post-treatment BDI-II scores were lower in the CBT group (M = 14.2, SD = 5.1) than in the waitlist group (M = 19.8, SD = 6.3), t(48) = −3.45, p = .001, d = 0.98.", "The CBT group was significantly better (p = 0.001), proving CBT is the best treatment for depression.", "t = −3.45, df = 48, p < .05, so the hypothesis was proven.", "Post-treatment BDI-II scores were lower in the CBT group, t(48) = −3.45, p = .000, d = .98.", "Post-treatment scores differed, M = 14.2 vs 19.8, F(1, 48) = −3.45, p = .001."], a: 0,
  x: { core: "An APA results sentence states the finding in words, gives descriptives for each group, then the statistic with df, the exact p, and the effect size.",
    opts: ["Correct.",
      "Two errors: a leading zero on p (it cannot exceed 1), and an overclaim: a waitlist comparison shows CBT beats no treatment, not other treatments. Nothing is ‘proven’.",
      "Vague (p < .05 instead of the exact p), no descriptives or effect size, and ‘proven’ is never appropriate.",
      "p = .000 is never reported (write p < .001), the descriptives are missing, and d keeps its leading zero (0.98) because d can exceed 1.",
      "Wrong statistic: a t-test reports t, and an F value can never be negative."],
    contrast: "Leading zeros: omit them for values that cannot exceed 1 (p, r); keep them for values that can (d).",
    root: "Publication Manual of the American Psychological Association, 7th edition (2020).",
    image: "A sentence as a train: the words are the engine, the statistics are the carriages in fixed order.",
    hook: "Means, t, p, d: ‘My Train Pulls Dozens of carriages.’",
    depth: "Italicize statistical symbols (M, SD, t, p, d). Give exact p to two or three decimals (p < .001 when smaller). Report effect sizes and confidence intervals: APA 7 emphasizes estimation, e.g. 95% CI of the difference [−8.86, −2.34]. Match the claim to the design.",
    beyond: "Statistical vs clinical significance: Jacobson and Truax's (1991) reliable change index shows whether individual patients moved into the functional range.",
    exam: "LU-style: ‘Write the results section for this output.’" } },
{ id: "ci8", c: "CI", k: "ci_psydyn", L: 6, t: "vignette",
  q: "Maya, 28, a Beirut bank employee, was admitted after an overdose following a breakup. History: intense, unstable relationships, fear of abandonment, self-criticism; an emotionally absent, unpredictable father; an anxious, intrusive mother. Since the 2019 crisis she has supported her family financially. Which formulation statement is strongest?",
  o: ["Probable borderline-level organization: the breakup reactivated an abandoned-self / rejecting-object dyad rooted in unpredictable early care; the overdose may express rage turned inward and a plea for care, and her parentified role since 2019 perpetuates unmet needs", "Neurotic-level organization with an Oedipal conflict over her father; the overdose was a manipulative gesture", "The overdose is fully explained by the economic crisis; her personal history is irrelevant", "She meets criteria for bipolar I disorder because her mood is unstable", "Her mother's intrusiveness is the precipitating factor of this admission"], a: 0,
  x: { core: "A strong formulation is a mechanism: why her (predisposing early relational patterns), why now (the breakup reactivating abandonment), why it continues (parentified role, isolation, self-criticism), and what it predicts for treatment, in tentative, hypothesis-based language.",

function md(t) {
  const lines = String(t || "").split(/\n/);
  let h = "", inList = false;
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, "$1<i>$2</i>");
  lines.forEach((ln) => {
    const l = ln.trim();
    if (/^[-*•]\s+/.test(l)) { if (!inList) { h += "<ul>"; inList = true; } h += "<li>" + inline(l.replace(/^[-*•]\s+/, "")) + "</li>"; return; }
    if (inList) { h += "</ul>"; inList = false; }
    if (!l) return;
    if (/^#{1,4}\s/.test(l)) { h += "<h4>" + inline(l.replace(/^#+\s/, "")) + "</h4>"; return; }
    h += "<p>" + inline(l) + "</p>";
  });
  if (inList) h += "</ul>";
  return h;
}

function calChart(cal) {
  const W = 420, H = 200, l = 40, b = 30, t = 12, r = 10;
  const x = (i) => l + ((W - l - r) / 4) * (i - 0.5), y = (v) => t + (H - t - b) * (1 - v);
  const ideal = [0.25, 0.5, 0.75, 0.95];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibration chart">`;
  [0, 0.5, 1].forEach((v) => { s += `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)"/><text x="${l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v * 100}%</text>`; });
  cal.forEach((c, i) => {
    const bw = 36;
    if (c.acc != null) s += `<rect x="${x(i + 1) - bw / 2}" y="${y(c.acc)}" width="${bw}" height="${y(0) - y(c.acc)}" fill="var(--ink)"/>`;
    s += `<line x1="${x(i + 1) - bw / 2 - 4}" x2="${x(i + 1) + bw / 2 + 4}" y1="${y(ideal[i])}" y2="${y(ideal[i])}" stroke="var(--hl)" stroke-width="3"/>`;
    s += `<text x="${x(i + 1)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--ink)">${CONF[c.c]}</text><text x="${x(i + 1)}" y="${H - 1}" text-anchor="middle" font-size="10" fill="var(--muted)">n=${c.n}</text>`;
  });
  return s + `</svg><p class="muted" style="font-size:12px;margin:0">Bars: your accuracy. Cyan marks: a well-calibrated target.</p>`;
}

/* ---------- coach ---------- */
async function coach() {
  const el = $("#coach_in"); const msg = el ? el.value.trim() : "";
  if (!msg) return;
  if (el) el.value = "";
  const low = msg.toLowerCase();
  const local = [];
  if (/\bharder|tougher|more difficult\b/.test(low)) { S.settings.levelAdj = clamp(S.settings.levelAdj + 1, -3, 3); local.push("Level raised."); }
  if (/\beasier|too hard\b/.test(low)) { S.settings.levelAdj = clamp(S.settings.levelAdj - 1, -3, 3); local.push("Level lowered."); }
  COURSE_ORDER.forEach((c) => { if (low.includes("only " + COURSES[c].short.toLowerCase()) || low.includes("only " + c.toLowerCase())) { S.settings.course = c; local.push("Only " + COURSES[c].short + " now."); } });
  if (/all courses/.test(low)) { S.settings.course = "ALL"; local.push("All courses."); }
  save();
  if (!AI) { V.coach.reply = local.length ? local.join(" ") : "Noted. Claude access is off, so I understand only: harder, easier, only <course>, all courses."; render(); return; }
  V.coach.busy = true; V.coach.reply = local.join(" ") + (local.length ? " " : "") + "…"; render();
  const cur = V.p && V.p.item ? V.p.item : null;
  const course = cur ? cur.c : (S.settings.course !== "ALL" ? S.settings.course : null);
  try {
    const r = await AI.json(`You are the controller of an adaptive study app for a Lebanese University clinical psychology Master 1 student. The student wrote to their tutor: "${msg}"
Current settings: course filter ${S.settings.course}; level adjustment ${S.settings.levelAdj}; recall-first ${S.settings.recallFirst}. Every question in this app is multiple choice.
Courses (keys): ${COURSE_ORDER.map((c) => c + "=" + COURSES[c].short).join(", ")}.
${cur ? "The question on screen: " + cur.q + "\n" : ""}${course ? "Concepts in the current course: " + conceptsOf(course).map((k) => k.name).join("; ") + "\n" : ""}Answer the student briefly (max 120 words, professor tone; if they asked a content question, answer it well) AND decide setting changes.
Reply with ONLY JSON: {"reply":"...","course":"ALL"|one course key|null,"level_delta":-2..2,"recall_first":true|false|null,"focus_concept":"exact concept name"|null,"standing_instruction":"a durable instruction to remember for question writing, or null"}`, { modelTier: "quick", cache: false });
    if (r.course && (r.course === "ALL" || COURSES[r.course])) S.settings.course = r.course;
    if (r.level_delta && !local.some((x) => x.startsWith("Level"))) S.settings.levelAdj = clamp(S.settings.levelAdj + (+r.level_delta || 0), -3, 3);
    if (r.recall_first != null) S.settings.recallFirst = !!r.recall_first;
    if (r.standing_instruction) { S.settings.notes.push(String(r.standing_instruction).slice(0, 200)); S.settings.notes = S.settings.notes.slice(-8); }
    if (r.focus_concept && course) { const k = conceptsOf(course).find((x) => x.name.toLowerCase() === String(r.focus_concept).toLowerCase()); if (k && V.p) V.p.ctx = Object.assign({}, V.p.ctx, { mode: "concept", concept: k.id, course: k.c }); }
    V.coach.reply = (local.length ? local.join(" ") + " " : "") + (r.reply || "Done.");
    save();
  } catch (e) { V.coach.reply = (local.join(" ") + " " + aiFail(e)).trim(); }
  V.coach.busy = false; render();
}

    if (k === "f") { click('[data-a="exflag"]'); return; }
    return;
  }
  if (V.tab === "modes" && V.rapid && V.rapid.phase === "run") {
    const ord = V.rapid.order; if (letter >= 0 && ord && letter < ord.length) click(`[data-a="rapidans"][data-v="${ord[letter]}"]`);
    return;
  }
  if (V.tab === "practice" && V.p && V.p.item && !V.p.lesson && !V.p.checkpoint) {
    const P = V.p;
    if (P.result) { if (k === "Enter") click('[data-a="next"]'); return; }
    if (P.phase !== "options") return;
    if (letter >= 0 && letter < P.order.length) { click(`[data-a="choose"][data-v="${P.order[letter]}"]`); return; }
    if (P.chosen != null && /^[1-4]$/.test(k)) { click(`[data-a="submit"][data-v="${k}"]`); return; }
  }
});
function saveExW() { const E = V.exam; if (!E) return; const id = E.ids[E.i]; const el = document.getElementById("exw_" + id); if (el) E.ans[id] = Object.assign(E.ans[id] || {}, { text: el.value }); }
function closeModes() {
  if (V.exam) clearInterval(V.exam.timer);
  if (V.rapid) clearInterval(V.rapid.timer);
  if (V.deep && V.deep.ctl) V.deep.ctl.abort();
  V.full = null; V.grand = null; V.chat = null; V.exam = null; V.rapid = null; V.deep = null; V.spssOpen = false;
}
function openMode(v) {
  closeModes(); V.tab = "modes";
  const c0 = S.settings.course !== "ALL" ? S.settings.course : "ACT";
  if (v === "review" || v === "weak") { startPractice({ mode: v }); return; }
  if (v === "exam") V.exam = { phase: "setup", c: c0, n: 15, min: 30 };
  if (v === "full") V.full = { c: V.fullC || c0 };
  if (v === "grand") { const g = S.settings.grand || {}; V.grand = { courses: Array.isArray(g.courses) && g.courses.length ? g.courses.filter((c) => COURSES[c]) : COURSE_ORDER.slice(), n: g.n || "all", fmt: g.fmt || "exam", order: g.order || "mixed", time: g.time || "none" }; }
  if (v === "rapid") V.rapid = { phase: "setup" };
  if (v === "interview") V.chat = { kind: "interview", phase: "setup", steps: [], persona: "" };
  if (v === "viva") V.chat = { kind: "viva", phase: "setup", c: c0, k: "" };
  if (v === "deep") V.deep = { phase: "setup", c: c0, k: "" };
  if (v === "spss") V.spssOpen = true;
  if (v === "case") { caseLab(); return; }
  render(); window.scrollTo(0, 0);
}
async function caseLab() {
  if (!AI) return;
  GEN.busy = true; GEN.msg = "Writing a Lebanese clinical case across three courses…"; V.tab = "practice"; V.p = { ctx: { mode: "continue" }, item: null, phase: "loading", start: Date.now(), removed: [] }; render();
  const three = shuffle(COURSE_ORDER).slice(0, 3);
  try {
    const r = await AI.json(`Write one realistic clinical case set in Lebanon for a Lebanese University Professional Master 1 clinical psychology student (multilingual patient, family context, current Lebanese realities), 150-220 words. Then write 4 items about this same case drawing on these courses: ${three.map((c) => c + " = " + COURSES[c].name).join("; ")}. Level about L${Math.max(3, Math.round(three.reduce((a, c) => a + effLevel(c), 0) / 3))}.
${PROFILE}
Reply with ONLY JSON: {"vignette":"...","items":[ITEM with an extra field "course": one of ${three.join(", ")}]}
Each ITEM shaped exactly like: ${itemSchema}`, { modelTier: "default", cache: false });
    const all = [];
    (r.items || []).forEach((g) => { const c = COURSES[g.course] ? g.course : three[0]; all.push(...addGenerated([g], c, { src: "case", vg: r.vignette })); });
    GEN.busy = false; GEN.msg = "";
    if (all.length) startPractice({ mode: "case", queue: all.map((i) => i.id), left: all.length });
    else { GEN.msg = "The case came back empty. Try again."; if (V.p) V.p.phase = "caseerr"; render(); }
  } catch (e) { GEN.busy = false; GEN.msg = aiFail(e) || "Stopped."; if (V.p) V.p.phase = "caseerr"; render(); }
}
function logAdd() {
  const g = (id) => (($("#" + id) || {}).value || "").trim();
  const e = { id: "l" + Date.now().toString(36), date: g("lg_date"), site: g("lg_site"), hours: +g("lg_hours") || 0, type: g("lg_type"), code: g("lg_code"), note: g("lg_note") };
  const txt = e.code + " " + e.note;
  const warn = /\b[A-Z][a-z]{2,}\s+[A-Z][a-z]{2,}\b/.test(txt) ? "This looks like it contains a full name." : /\d{6,}/.test(txt) ? "This looks like it contains an ID or file number." : "";
  if (warn && !V.logWarn) { V.logWarn = warn + " Use initials or a case code."; render(); return; }
  V.logWarn = "";
  if (!e.date) return;
  S.log.push(e); save();
  ["lg_site", "lg_hours", "lg_code", "lg_note"].forEach((id) => { const el = $("#" + id); if (el) el.value = ""; });
  render();
}
async function buildReport() {
  const m = ($("#rp_m") || {}).value;
  const es = S.log.filter((e) => (e.date || "").startsWith(m));
  const hours = es.reduce((a, e) => a + (+e.hours || 0), 0);
  const count = (t) => es.filter((e) => e.type === t).length;
  const local = `Monthly internship report: ${m}\nClinical Internship 1 · Université Libanaise, Section II Fanar\n\nTotal hours: ${hours}\nObservations: ${count("observation")} · Clinical interviews: ${count("interview")} · Follow-ups: ${count("follow-up")} · Presentations: ${count("presentation")} · Supervision: ${count("supervision")}\n\nActivities:\n${es.map((e) => `- ${e.date} · ${e.type} · ${e.hours} h${e.site ? " · " + e.site : ""}${e.code ? " · " + e.code : ""}${e.note ? ": " + e.note : ""}`).join("\n")}\n\nReflections and learning goals for next month:\n- \n\nQuestions for supervision:\n${S.sup || "- "}`;
  if (!AI) { V.report.text = local; render(); return; }
  V.report.busy = true; V.report.text = ""; render();
  try {
    await AI(`Draft a professional monthly internship report (English) for a Lebanese University Professional Master 1 clinical psychology intern, to give to the university supervisors. Use only the data below; never invent patients or events; keep case codes as given. Sections: Summary of hours and activities; Clinical activities (grouped); Theoretical links (connect activities to course concepts where the notes support it); Reflections and difficulties; Goals for next month; Questions for supervision. Plain text with simple headings.\n\nDATA:\n${local}`, { modelTier: "default", cache: false, onText: ({ text }) => { V.report.text = text; render(); } });
  } catch (e) { V.report.text = local + "\n\n(" + aiFail(e) + ")"; }
  V.report.busy = false; render();
}

/* ---------- boot ---------- */
render();
setInterval(() => { if (V.tab === "home") render(); }, 60000);
})();
