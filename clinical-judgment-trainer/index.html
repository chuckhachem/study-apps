/* Engine: state, adaptive serving, rendering. */
const KEY='praxis-clinic-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={pts:0,seen:{},hist:{say:[],eye:[]},lvl:{say:1,eye:1},rooms:{},mode:'say',theme:'auto',n:0,right:0};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);S=Object.assign(S,p);}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const BANK={say:SAY,eye:EYE};
const MODE_NAME={say:'Say',eye:'Eye',room:'Room',record:'Record'};
const PTS={1:2,2:4,3:7};
const RANKS=[[2,'Intern'],[6,'Resident'],[15,'Attending'],[30,'Senior attending'],[41,'Master clinician']];
let cur=null,confirmReset=false,roomRun=null;

function applyTheme(){
  const r=document.documentElement;
  if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
  $('#themebtn').textContent='theme: '+S.theme;
}
function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function years(){return Math.min(40,S.pts/10);}
function rankOf(y){for(const [m,n] of RANKS)if(y<m)return n;return RANKS[RANKS.length-1][1];}
function header(){
  const y=years();
  $('#yrs').textContent=y.toFixed(1);
  $('#rank').textContent=rankOf(y);
  $('#fill').style.width=(y/40*100)+'%';
  $('#track').setAttribute('aria-valuenow',y.toFixed(1));
}
function pick(mode){
  const L=S.lvl[mode],pool=BANK[mode];
  const recent=S.hist[mode+'_ids']||[];
  const scored=pool.map(it=>{
    const s=S.seen[it.id];let sc=0;
    if(!s)sc+=2;
    if(it.lvl===L)sc+=2;else if(Math.abs(it.lvl-L)===1)sc+=1;
    if(s&&s.w>s.r)sc+=2;
    if(recent.slice(-3).includes(it.id))sc-=10;
    return {it,sc:sc+Math.random()*1.5};
  }).sort((a,b)=>b.sc-a.sc);
  return scored[0].it;
}
function setMode(m){
  S.mode=m;save();roomRun=null;confirmReset=false;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.m===m));
  if(m==='say'||m==='eye')showItem(pick(m),m);
  else if(m==='room')showRooms();
  else showRecord();
  window.scrollTo({top:0});
}
function lvlName(l){return ['','Foundation','Working','Senior'][l];}

/* ---- Say / Eye ---- */
function showItem(it,mode){
  const order=shuffle(it.opts.length);
  cur={it,mode,order,done:false};
  const letters='ABCD';
  $('#view').innerHTML=
   '<div class="meta"><span>'+MODE_NAME[mode]+'</span><span>'+esc(it.tag)+'</span><span>'+lvlName(it.lvl)+'</span></div>'+
   '<div class="setup">'+it.setup+'</div>'+
   '<div class="q">'+esc(it.q)+'</div>'+
   '<div class="opts" id="opts">'+order.map((oi,pos)=>
     '<button class="opt" type="button" data-pos="'+pos+'"><span class="k">'+letters[pos]+'</span><span class="t">'+esc(it.opts[oi].t)+'</span></button>').join('')+
   '</div><div id="fb"></div>';
  document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.pos)));
}
function answer(pos){
  if(!cur||cur.done)return;
  cur.done=true;
  const {it,mode,order}=cur;
  const chosen=order[pos],ok=chosen===0,keyPos=order.indexOf(0);
  const letters='ABCD';
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===keyPos)b.classList.add('right');
    else if(i===pos)b.classList.add('wrong');
  });
  const prev=S.seen[it.id]||{r:0,w:0};
  const first=!S.seen[it.id]||prev.r===0;
  if(ok){prev.r++;S.right++;S.pts+=first?PTS[it.lvl]:PTS[it.lvl]*0.25;}else prev.w++;
  S.seen[it.id]=prev;S.n++;
  const h=S.hist[mode];h.push(ok);if(h.length>6)h.shift();
  const ids=S.hist[mode+'_ids']=(S.hist[mode+'_ids']||[]);ids.push(it.id);if(ids.length>8)ids.shift();
  const last4=h.slice(-4);
  if(last4.length===4&&last4.every(Boolean)&&S.lvl[mode]<3){S.lvl[mode]++;S.hist[mode]=[];}
  else if(h.length>=4&&h.slice(-4).filter(x=>!x).length>=3&&S.lvl[mode]>1){S.lvl[mode]--;S.hist[mode]=[];}
  save();header();
  const others=order.map((oi,p)=>({oi,p})).filter(x=>x.p!==pos&&x.oi!==0);
  let html='<div class="explain">'+
   '<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct.':'Not this one.')+'</div>'+
   '<div class="blk"><h3>Your choice, '+letters[pos]+'</h3><p>'+esc(it.opts[chosen].why)+'</p></div>';
  if(!ok)html+='<div class="blk"><h3>The best answer, '+letters[keyPos]+'</h3><p>'+esc(it.opts[0].why)+'</p></div>';
  html+='<div class="blk"><h3>The other options</h3><ul>'+others.map(x=>'<li><b>'+letters[x.p]+'.</b> '+esc(it.opts[x.oi].why)+'</li>').join('')+'</ul></div>'+
   '<div class="blk"><h3>Memory hook</h3><p>'+esc(it.hook)+'</p></div>'+
   '<div class="blk vet"><h3>What forty years sees</h3><p>'+esc(it.vet)+'</p></div>'+
   '<div class="actions"><button class="btn acc" type="button" id="nextbtn">Next case</button></div></div>';
  $('#fb').innerHTML=html;
  $('#nextbtn').addEventListener('click',()=>{showItem(pick(mode),mode);window.scrollTo({top:0});});
  $('#nextbtn').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'auto',block:'nearest'});
}

/* ---- Room ---- */
function showRooms(){
  $('#view').innerHTML='<div class="meta"><span>Room</span><span>Interview simulations</span></div>'+
   '<p style="margin:0;color:var(--muted)">Each case is a live interview. Choose what you would say at every step. The patient answers in character, so a poor opening changes what you hear next.</p>'+
   '<div class="cases">'+ROOMS.map(r=>{
     const b=S.rooms[r.id];
     return '<button class="case" type="button" data-id="'+r.id+'"><strong>'+esc(r.title)+'</strong><span>'+esc(r.blurb)+'</span><span class="stepbar">'+lvlName(r.lvl).toUpperCase()+' &middot; '+r.steps.length+' STEPS &middot; '+(b?('BEST '+b.best+'/'+b.max):'NOT YET RUN')+'</span></button>';
   }).join('')+'</div>';
  document.querySelectorAll('.case').forEach(b=>b.addEventListener('click',()=>startRoom(b.dataset.id)));
}
function startRoom(id){
  const r=ROOMS.find(x=>x.id===id);
  roomRun={r,i:0,score:0,max:r.steps.length*2,log:[]};
  showStep();window.scrollTo({top:0});
}
function showStep(){
  const {r,i}=roomRun,st=r.steps[i],order=shuffle(st.opts.length);
  roomRun.order=order;roomRun.done=false;
  $('#view').innerHTML='<div class="meta"><span>Room</span><span>'+esc(r.title)+'</span></div>'+
   (i===0?'<div class="setup">'+r.intro+'</div>':'')+
   '<div class="stepbar">STEP '+(i+1)+' OF '+r.steps.length+'</div>'+
   '<div class="patient">'+st.patient+'</div>'+
   '<div class="q">'+esc(st.q)+'</div>'+
   '<div class="opts">'+order.map((oi,pos)=>'<button class="opt" type="button" data-pos="'+pos+'"><span class="k">'+'ABC'[pos]+'</span><span class="t">'+esc(st.opts[oi].t)+'</span></button>').join('')+'</div><div id="fb"></div>';
  document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>stepAnswer(+b.dataset.pos)));
}
function stepAnswer(pos){
  if(roomRun.done)return;roomRun.done=true;
  const {r,i,order}=roomRun,st=r.steps[i],o=st.opts[order[pos]];
  const best=Math.max(...st.opts.map(x=>x.score));
  roomRun.score+=o.score;
  document.querySelectorAll('.opt').forEach((b,p)=>{
    b.disabled=true;
    const sc=st.opts[order[p]].score;
    if(p===pos&&o.score!==1)b.classList.add(o.score===2?'right':'wrong');
    if(sc===best&&p!==pos)b.classList.add('right');
  });
  const tag=o.score===2?'Strong move':(o.score===1?'Acceptable, not ideal':'Costly move');
  const last=i===r.steps.length-1;
  $('#fb').innerHTML='<div class="patient">'+o.reply+'</div><div class="explain"><div class="verdict '+(o.score===2?'ok':(o.score===0?'no':''))+'">'+tag+'</div>'+
   '<div class="blk"><h3>Why</h3><p>'+esc(o.why)+'</p></div>'+
   (o.score<best?'<div class="blk"><h3>The strongest move</h3><p>'+esc(st.opts.find(x=>x.score===best).why)+'</p></div>':'')+
   '<div class="actions"><button class="btn acc" type="button" id="nx">'+(last?'See debrief':'Continue the interview')+'</button></div></div>';
  $('#nx').addEventListener('click',()=>{if(last)endRoom();else{roomRun.i++;showStep();window.scrollTo({top:0});}});
  $('#fb').scrollIntoView({behavior:'auto',block:'nearest'});
}
function endRoom(){
  const {r,score,max}=roomRun;
  const prev=S.rooms[r.id];
  const gain=Math.max(0,score-(prev?prev.best:0));
  S.pts+=gain*r.lvl*1.5;
  S.rooms[r.id]={best:Math.max(score,prev?prev.best:0),max};
  save();header();
  const pct=score/max,grade=pct>=.85?'Close to a senior reading of the room.':(pct>=.6?'Sound instincts with a few costly moments.':'Replay it: the early steps decide what you hear later.');
  $('#view').innerHTML='<div class="meta"><span>Room</span><span>Debrief</span></div>'+
   '<div class="explain"><div class="verdict">'+score+' of '+max+' &middot; '+grade+'</div>'+
   '<div class="blk vet"><h3>What forty years sees</h3><p>'+esc(r.debrief)+'</p></div>'+
   '<div class="actions"><button class="btn" type="button" id="again">Run it again</button><button class="btn ghost" type="button" id="back">All cases</button></div></div>';
  $('#again').addEventListener('click',()=>startRoom(r.id));
  $('#back').addEventListener('click',()=>{roomRun=null;showRooms();});
  window.scrollTo({top:0});
}

/* ---- Record ---- */
function showRecord(){
  const acc=S.n?Math.round(S.right/S.n*100):0;
  const tags={};
  [...SAY,...EYE].forEach(it=>{const s=S.seen[it.id];if(!s)return;const t=tags[it.tag]||(tags[it.tag]={r:0,w:0});t.r+=s.r;t.w+=s.w;});
  const rows=Object.entries(tags).map(([k,v])=>({k,n:v.r+v.w,p:Math.round(v.r/(v.r+v.w)*100)})).sort((a,b)=>a.p-b.p);
  const done=Object.keys(S.seen).length,total=SAY.length+EYE.length;
  $('#view').innerHTML='<div class="meta"><span>Record</span></div>'+
   '<div class="stats"><div class="stat"><b>'+years().toFixed(1)+'</b><span>Years of eye</span></div>'+
   '<div class="stat"><b>'+acc+'%</b><span>Accuracy ('+S.n+' answers)</span></div>'+
   '<div class="stat"><b>'+done+'/'+total+'</b><span>Items met</span></div>'+
   '<div class="stat"><b>'+lvlName(S.lvl.say)+'</b><span>Say level</span></div>'+
   '<div class="stat"><b>'+lvlName(S.lvl.eye)+'</b><span>Eye level</span></div></div>'+
   '<div class="blk"><h3>Accuracy by topic, weakest first</h3>'+(rows.length?'<div class="bars">'+rows.map(r=>'<div class="b"><span>'+esc(r.k)+'</span><div class="bt"><i style="width:'+r.p+'%"></i></div><span class="n">'+r.p+'%</span></div>').join('')+'</div>':'<div class="empty">Answer a few Say or Eye items and your weak spots will appear here.</div>')+'</div>'+
   '<div class="blk"><h3>Interview simulations</h3>'+(Object.keys(S.rooms).length?'<div class="bars">'+ROOMS.filter(r=>S.rooms[r.id]).map(r=>'<div class="b"><span>'+esc(r.title)+'</span><div class="bt"><i style="width:'+(S.rooms[r.id].best/S.rooms[r.id].max*100)+'%"></i></div><span class="n">'+S.rooms[r.id].best+'/'+S.rooms[r.id].max+'</span></div>').join('')+'</div>':'<div class="empty">No interview run yet. Open Room and begin with the first case.</div>')+'</div>'+
   '<div class="actions" id="rs">'+(confirmReset?'<span>Erase all progress on this device?</span><button class="btn acc" type="button" id="yes">Yes, erase</button><button class="btn ghost" type="button" id="no">Cancel</button>':'<button class="btn ghost" type="button" id="rst">Reset progress</button>')+'</div>';
  const rst=$('#rst');if(rst)rst.addEventListener('click',()=>{confirmReset=true;showRecord();});
  const no=$('#no');if(no)no.addEventListener('click',()=>{confirmReset=false;showRecord();});
  const yes=$('#yes');if(yes)yes.addEventListener('click',()=>{
    S={pts:0,seen:{},hist:{say:[],eye:[]},lvl:{say:1,eye:1},rooms:{},mode:'record',theme:S.theme,n:0,right:0};
    confirmReset=false;save();header();showRecord();});
}

document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
$('#themebtn').addEventListener('click',()=>{S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme]||'auto';applyTheme();save();});
applyTheme();header();setMode(S.mode&&MODE_NAME[S.mode]?S.mode:'say');
</script>
